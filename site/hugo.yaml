baseURL: https://fubar-coder.github.io/bb2-c/
title: bb2-c
languageCode: en
defaultContentLanguage: en
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true # the home page lays out its hero with HTML
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/fubar-coder/bb2-c
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  theme:
    default: system
    displayToggle: true
  page:
    width: normal
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: true
    width: normal
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  editURL:
    enable: false
