description: Packing and unpacking in memory by Reflective Images - IFF ILBM pictures into bitmaps and palettes, ByteRun1 data and Pack-Ice files.
intro: |
  This library unpacks data that a program holds in memory. Most of its
  commands deal with IFF ILBM pictures: `UnpackIFF` unpacks the picture
  into a bitmap object, `ILBMPalette` takes its colours (the CMAP chunk)
  into a palette object, `ILBMGrab` does both, and `LoadIFF` loads a
  picture file and unpacks it in one step. The bitmap must already exist
  and be at least as wide and as deep as the picture; the palette object
  gets as many colours as the picture has. Besides, `PackPBM` and
  `UnPackPBM` pack and unpack blocks with ByteRun1, the method of IFF
  pictures, and `DeIce` unpacks files packed with Pack-Ice 2.40.

  All commands except `ILBMGrab` and `UnPackPBM` can be used as functions
  that return -1 on success and 0 on failure, or a length (`PackPBM`) or
  a long (`ChunkHeader`). `LoadIFF` reads a file through DOS, so use it
  in Amiga mode.

  `LoadIFF` loads the file into a memory bank of the RI Amos Func
  library, which must be present as well. It takes the first free bank
  from number 51 on, but that library has 50 banks unless the program
  asks for more with `BankLimit`; without that, `LoadIFF` always fails
  ([#770](https://github.com/fubar-coder/bb2-c/issues/770)).

  The unpacking of pictures has limits, kept from the original:

  - The chunks are searched for only near the start: the BMHD and CMAP
    chunks must lie within the first 5120 bytes of the data, the BODY
    within 5120 bytes behind the BMHD
    ([#766](https://github.com/fubar-coder/bb2-c/issues/766)).
  - Every picture is taken as packed with ByteRun1; an unpacked picture
    comes out garbled
    ([#773](https://github.com/fubar-coder/bb2-c/issues/773)).
  - Only widths that are a multiple of 16 pixels unpack correctly
    ([#775](https://github.com/fubar-coder/bb2-c/issues/775)), and only up
    to 1024 pixels: a wider picture is not unpacked, though the command
    reports success ([#774](https://github.com/fubar-coder/bb2-c/issues/774)).
  - A stencil (mask plane) in the picture is not recognised; save
    pictures without one.

  Loading a picture of up to 320 by 256 pixels and 32 colours into
  bitmap 0 and palette 0:

  ```blitzbasic
  BankLimit 60
  BitMap 0,320,256,5
  If LoadIFF("picture.iff",0,0)
    NPrint "loaded"
  EndIf
  ```

  *Based on the RI Pack Lib guide by Reflective Images.*
