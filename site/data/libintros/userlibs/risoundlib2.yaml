description: The second sound library by Reflective Images - CludgeSound for IFF 8SVX samples in memory, and sound output through AHI with its audio mode requester.
intro: |
  This library is the successor of the first sound library
  ([risoundlib]({{< relref "/docs/libraries/userlibs/risoundlib" >}})):
  it has its `CludgeSound`, which makes a sound object of
  [audiolib]({{< relref "/docs/libraries/commands/audiolib" >}}) from an
  IFF 8SVX sample in memory, and adds commands for AHI, the retargetable
  audio system for the Amiga (ahi.device, version 4 or newer): opening the
  device, playing sound objects and raw samples through it, and AHI's
  requester for choosing an audio mode.

  `OpenAHI` opens the device and must come before the other AHI
  commands; `CloseAHI` closes it again, and the end of the program does
  too. `PlaySoundAHI` plays a sound object, such as one made with
  `CludgeSound` or `LoadSound`, and returns while it plays; the next
  `PlaySoundAHI` or `PlayRawAHI` stops it. `AHIOutputRequest` shows the
  requester, and `AHIRequestedID` and `AHIRequestedFreq` return what the
  user chose. A sound made with `CludgeSound` can also be played with
  `Sound` of audiolib.

  AHI needs Kickstart 2.04 or newer. On Kickstart 1.x programs with the
  library run, but `OpenAHI` returns 0. The AHI commands of the BB2 C
  port are tested with a test device that answers as the documentation
  of ahi.device describes, not with an installed AHI.

  The library has the same number and the same `CludgeSound` as the first
  sound library, so only one of the two can be installed. It belongs to
  the library variant rwe-1999-ahi, which has it instead of the first one
  ([The RWE userlibs]({{< relref "/docs/blitz2-internals/rwe-userlibs" >}})).

  ```blitzbasic
  LoadSound 0,"sound.8svx"
  If OpenAHI(0)
    PlaySoundAHI 0
    MouseWait
    CloseAHI
  EndIf
  ```
