description: Plays ANIM5 and ANIM7 animations from memory into bitmaps - by Reflective Images.
intro: |
  This library plays IFF animations (ANIM files) in the two common delta
  formats, ANIM5 and ANIM7. The animation must be loaded into memory by
  the program, in chip or fast memory; the library works on its address.
  Frames are drawn into bitmap objects, at any position inside the
  bitmap, and colour changes of the frames go into a palette object.
  `RIAnimWidth`, `RIAnimHeight` and `RIAnimDepth` tell the size of the
  animation, so suitable bitmaps can be made before playing it.

  `RIAnimInit` unpacks the first frame into a bitmap and sets the
  palette; each `RINextAnimFrame` then changes a bitmap into the next
  frame. In these formats every frame is stored as the change against
  the frame two steps before it, so an animation is played double
  buffered: two bitmaps that both start with the first frame, and the
  frames drawn into them in turn. A first frame stored as a delta
  instead of a full picture is not supported.

  `RIAnimInit` refuses a bitmap that is too narrow or not deep enough
  for the first frame. It checks neither the height nor whether the
  animation fits at the chosen position, so make the bitmaps large
  enough. With runtime error checking, a position outside the bitmap
  stops the program with the runtime error "Animation position outside
  the bitmap".

  Place an ANIM7 animation at an even byte of the bitmap: an `x` of 0
  to 7, 16 to 23 and so on, or an even byte offset. At an odd byte its
  frames crash a 68000; with runtime error checking, `RINextAnimFrame`
  stops before such a frame with the runtime error "Animation position
  on an odd byte for ANIM7".

  The library steps through the animation from chunk to chunk, within
  its length, and skips the pad byte the IFF standard puts behind a
  chunk of odd length; chunks other than frames, such as annotations,
  may lie between the frames. `RIAnimInit` refuses an animation written
  without those pad bytes.

  The library uses the RI Pack library to unpack the first frame and to
  read the palettes, so that library must be installed too.

  With an animation loaded at address `m`, played once through bitmaps
  0 and 1:

  ```blitzbasic
  w=RIAnimWidth(m) : h=RIAnimHeight(m) : d=RIAnimDepth(m)
  BitMap 0,w,h,d
  BitMap 1,w,h,d
  If RIAnimInit(m,0,0)
    CopyBitMap 0,1
    AnimLoop Off
    b=1
    While RINextAnimFrame(b)
      ; show bitmap b here
      b=1-b
    Wend
  EndIf
  ```

  The fixed bugs of the library are listed in
  [Fixes in rianimlib]({{< relref "/docs/compared-with-original/libraries/userlibs/rianimlib#rianimlib-fixes" >}}).

  *Based on the RI Anim Lib guide by Reflective Images.*
