description: Popup menus with sub menus in borderless windows on a screen, by Reflective Images.
intro: |
  This library shows a popup menu: a list of items in a borderless
  window with a bevelled frame, in the font of the screen, opened at the
  top left corner of a screen. Moving the mouse over an item highlights
  it; an item with a sub menu opens the sub menu at once, in a window to
  the right of the item. A mouse button closes all menus again.

  The program builds the menu itself in memory, as a list of items.
  Each item starts with these fields:

  | Offset | Size | Contents |
  |---|---|---|
  | 0 | long | the address of the next item, 0 for the last |
  | 4 | long | the address of its text, a string that ends in a zero byte; 0 makes the item a separator line |
  | 8 | word | not used by the library |
  | 10 | word | not used by the library |
  | 12 | long | the address of the first item of its sub menu, 0 for none |

  Used as a function, `PopUpWindow` returns the address of the item
  chosen, or 0 if none was, so the program tells the items by their
  addresses.

  The fixed bugs of the library are listed in
  [Fixes in popupwinlib](/docs/compared-with-original/libraries/userlibs/popupwinlib/#popupwinlib-fixes).
