description: Popup menus with sub menus in borderless windows on a screen, by Reflective Images.
intro: |
  This library shows a popup menu: a list of items in a borderless
  window with a bevelled frame, in the font of the screen, opened at the
  top left corner of a screen. Moving the mouse over an item highlights
  it; an item with a sub menu opens the sub menu at once, in a window to
  the right of the item. A mouse button closes all menus again. It needs
  Kickstart 2.0 or later, as it opens its windows with tags.

  The program builds the menu itself in memory, as a list of items.
  Each item starts with a long that points to the next item (0 for the
  last), a long that points to its text, a string that ends in a zero
  byte (0 makes the item a separator line), two words the library does
  not use, and a long that points to the first item of its sub menu (0
  for none).

  Kept from the original, and the reason the library is of little use:
  `PopUpWindow` does not tell the program which item was chosen
  ([#471](https://github.com/fubar-coder/bb2-c/issues/471)). It also
  switches the power light and the audio filter of the Amiga on or off
  for every menu with sub menus it shows
  ([#468](https://github.com/fubar-coder/bb2-c/issues/468)).
