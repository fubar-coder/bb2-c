description: Chunky bitmaps (one byte per pixel) by Reflective Images, with a conversion into planar bitmaps of 256 colours.
intro: |
  This library keeps chunky bitmaps: images with one byte per pixel,
  which a program can draw into with plain `Poke`s, and converts them to
  the planar bitmaps the Amiga displays. Chunky bitmaps are numbered
  Blitz objects of their own, 0 to 7 by default; `ChunkyBitmap` makes
  one and `ChunkyData` gives the address of its pixels, row after row.
  The memory of a chunky bitmap is freed at the end of the program.

  `ChunkyToPlanar` converts a chunky bitmap into the top left of a
  bitmap of 8 bitplanes (256 colours) that is at least as big. The width
  of the chunky bitmap must be a multiple of 16 pixels, and the
  bitplanes of the bitmap equally far apart, one after the other in one
  block of memory or interleaved. `RaycastSky`, which copies a column of
  a texture for a ray caster, assumes rows of 320 bytes in the chunky
  bitmap and in the texture. `PlanarToChunky` and `ChunkyLoadBitMap`
  were never written and do nothing. `ChunkyBitmap` works in Amiga mode
  only.

  `ChunkyToPlanar` is a little faster than the original's, and
  `RaycastSky` as fast.

  A chunky bitmap with one dot, converted into a bitmap whose planes lie
  in one block of chip memory:

  ```blitzbasic
  ChunkyBitmap 0,320,256
  Poke.b ChunkyData(0)+100*320+160,255
  m.l=AllocMem_(81920,$10002)
  CludgeBitMap 1,320,256,8,m
  ChunkyToPlanar 0,1
  ```
