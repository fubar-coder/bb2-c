description: The CIA Protracker library by Crossbones/Binary Assault, after Neil O'Rourke - loading and playing Protracker modules, with a master volume, a channel mask and tracker events for synchronising a program with its music.
intro: |
  This library plays Protracker modules: files in the "M.K." format with
  31 samples and four voices. Its play routine is the Protracker 2.3A CIA
  routine by Peter "Crayon" Hanning of Mushroom Studios, released as
  public domain. The library extends it with a master volume
  (`TrackerVolume`), a channel mask that keeps voices free for sound
  effects (`ChangeTrackerMask`) and tracker events. A tracker event is
  the effect `8xx`, which Protracker does not use: it passes its value
  to the program, which can wait for it or check for it to time
  graphics to the music.

  Modules live in the library's own numbered slots, 0 to 8; they are
  not Blitz objects. `LoadTrackerModule` loads a module file into chip
  memory, `DecodeModule` takes a module that is already in memory and
  copies it into chip memory if it is elsewhere. `StartTracker` plays
  the module of a slot from the beginning.

  The library can play in two ways. By default, in CIA mode, it sets up a
  CIA timer interrupt when the program starts, which plays the module by
  itself at the right tempo; `StartTracker` is all a program needs.
  After `ChangeTrackerVBlank` the program plays the module itself
  instead: it calls `PlayTracker` 50 times a second, for example from a
  vertical blank interrupt handler. In that mode tempo commands of a
  module have no effect.

  ```blitzbasic
  ChangeTrackerVBlank
  If LoadTrackerModule(0,"mod.tune")<>-1 Then End
  x=StartTracker(0)
  SetInt 5
    PlayTracker
  End SetInt
  MouseWait
  StopTracker
  ```

  `LoadTrackerModule` reads the file with AmigaDOS. The known faults of
  the play routine, for example with some effect commands, are fixed
  ([Fixes in the Protracker play routine](/docs/compared-with-original/libraries/userlibs/ciatrklib/#protracker-play-routine)).

  *Based on the CIA Protracker Library documentation by Crossbones/Binary
  Assault.*
