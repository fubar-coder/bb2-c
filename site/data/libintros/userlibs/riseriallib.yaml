description: The serial port driven directly through the hardware with interrupts of its own, without serial.device - single bytes, blocks and strings; from Red When Excited's library sources, no author named.
intro: |
  This library drives the Amiga's serial port directly through the
  hardware registers, without serial.device. `SerialOpen` installs a
  receive and a transmit interrupt of the library: received bytes are
  kept in a buffer of 256 bytes until `SerialRead` or `SerialWait` takes
  them, and bytes written with `SerialWrite` go into a buffer of 128 and
  are sent in the background. `SerialClose` removes the interrupts; the
  port is also closed when the program ends.

  The port sends and receives 8 data bits with one stop bit. The baud rate
  is set with `SerialBaud` or with `SerialOpen baudrate`; the calculation
  uses the clock of a PAL Amiga. While the library's interrupts are
  installed, no other program may use the serial port, and serial.device
  must not be in use.

  The library is a version 1.0 and many of its commands do not work as
  their names promise: `SerialSendString`, `SerialReadString`,
  `SerialReadLong` and `SerialWriteLong` do not work at all, and the block
  commands do not open the port. The single-byte commands work, with care
  about the upper bits of the byte read (see `SerialRead`):

  ```blitzbasic
  SerialOpen 9600
  SerialWrite 65
  Repeat
  Until SerialGot
  b=SerialRead AND $FF
  NPrint "received ",b
  SerialClose
  ```

  The interrupt vectors are written at their fixed addresses in low memory;
  on a 68010 or later processor whose vector base has been moved, the
  library's interrupts are never called
  ([#804](https://github.com/fubar-coder/bb2-c/issues/804)).
