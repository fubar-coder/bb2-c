description: Hardware sprites on the Workbench screen by Reflective Images - Blitz shapes as sprites through the sprite functions of the operating system.
intro: |
  This library puts hardware sprites on the Workbench screen, or any
  other Intuition screen, in a way the system allows: it uses the sprite
  functions of graphics.library, so it needs Kickstart 3.0 or newer. A
  Blitz shape is converted into a sprite and gets one of the 8 sprite
  channels; the commands then name the sprite by its channel, 0 to 7.
  Channel 0 usually holds the mouse pointer.

  All commands work in Amiga mode only. `MoveWBSprite` and
  `ChangeWBSprite` need the address of the screen's ViewPort, which the
  function `ViewPort` of the screens library gives. Sprites the
  program does not free are freed when it ends.

  The shape is converted with a width rounded down to a multiple of 16;
  a shape narrower than 16 pixels gives no sprite. Kept from the
  original: the shape's rows are copied as if the width were a multiple
  of 16, so a shape of another width comes out garbled
  ([#918](https://github.com/fubar-coder/bb2-c/issues/918)), and a shape
  of height or depth 0 overwrites memory
  ([#917](https://github.com/fubar-coder/bb2-c/issues/917)). No command
  checks the channel number: a channel outside 0 to 7 reads or writes
  memory beside the library's sprite table
  ([#916](https://github.com/fubar-coder/bb2-c/issues/916)).

  A sprite on any free channel of the Workbench screen, moved to 100,50:

  ```blitzbasic
  WbToScreen 0
  vp.l=ViewPort(0)
  ch=GetWBSprite(0,0,0,-1)
  If ch>0
    MoveWBSprite vp,100,50,ch
    MouseWait
    FreeWBSprite ch
  EndIf
  ```
