description: Intuition menus - menu lists with titles, items and subitems of text or shapes, shortcuts, check marks, and enabling or disabling them.
intro: |
  A menu list is a Blitz object, numbered from 0. `MenuTitle` adds a menu,
  `MenuItem` and `ShapeItem` add items to it, and `SubItem` and `ShapeSub`
  add subitems to an item; menus, items and subitems are numbered from 0,
  menu 0 on the left and item 0 at the top. `SetMenu` gives the menu list
  to the used window; a window has one menu list at a time. The menus
  appear while the user holds the right mouse button. When the user picks
  an item, the window reports an event of class `$100` (part of the
  default IDCMP flags), and `MenuHit`, `ItemHit` and `SubHit` of the
  window library tell which item it was.

  An entry is placed after the ones before it, so they are best made in
  order; making an entry again with the same number replaces it. The
  flags of an item choose its kind: 0 an ordinary item, 1 an item that
  toggles a check mark, 2 such an item that clears the others of its
  menu when it is checked, 3 and 4 the same as 1 and 2 but checked at the
  start; a larger value is taken as Intuition's item flags themselves.

  Kept from the original: menu, item and subitem numbers are checked only
  with runtime error checking; without it, a wrong number reads beyond the
  end of the lists ([#416](https://github.com/fubar-coder/bb2-c/issues/416)).

  *Based on the menuslib guide by Acid Software.*
