description: The connection between a program run from the editor and the debugger's user interface.
intro: |
  When a program runs from the editor with the debugger, this library
  connects the run time part of the debugger, the debuglib library, with
  the debugger program the editor has loaded, which shows the program's
  state and takes the user's commands. Ctrl-Left Alt-C stops the running
  program. Executables use rundebuglib instead.
