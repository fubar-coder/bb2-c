description: The system's ASL requesters - files, drawers, fonts and screen modes chosen with the standard requesters of AmigaOS.
intro: |
  These functions open the standard requesters of the system's
  `asl.library` on the used screen: for a file, a drawer, a font or a
  screen mode. They work in Amiga mode only. On a system without
  `asl.library`, freqlib's `FileRequest$` gives a file requester of Blitz's own.

  ```blitzbasic
  MaxLen path$=160
  MaxLen fname$=64
  f$=ASLFileRequest$("Load picture",path$,fname$,"#?.iff")
  If f$<>"" Then LoadBitMap 0,f$
  ```

  As with `FileRequest$`, `path$` and `fname$` must be string variables
  with a `MaxLen` of at least 160 and 64; they give the drawer and the
  name to start with and get the ones chosen.

  Kept from the original: without `asl.library`, the file and drawer
  requesters return a broken string
  ([#62](https://github.com/fubar-coder/bb2-c/issues/62)).
