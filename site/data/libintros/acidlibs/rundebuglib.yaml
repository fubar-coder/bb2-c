description: Runtime errors of executables - the minimal error handling of executables created with runtime error checking on, without the debugger.
intro: |
  An executable created with runtime error checking on gets this library
  instead of the debugger. A runtime error that no `SetErr` handler takes is shown with
  its message in a requester, and the program ends.

  A runtime error inside a `SetInt` routine is shown in the same
  requester at the program's next statement, and the program ends; the
  routine is not called again in between.

  Ctrl-C ends such a program at its next `Print`, `NPrint`, `Edit$` or
  `Edit` on the console, as it ends a C program: it prints `***Break`
  and ends with the return code 20. A loop without input or output on
  the console is not stopped.
