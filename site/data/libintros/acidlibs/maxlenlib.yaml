description: MaxLen - a string variable with a fixed buffer of a given length.
intro: |
  `MaxLen a$=n` gives a string variable an empty buffer of `n`
  characters, which is kept as long as the strings assigned to it fit.
  Commands that write into a string variable directly, such as
  `FileRequest$` with its path and file name, or the record fields of
  `Fields`, need such a variable. The compiler turns `MaxLen` into a call
  of this library, for global and for local strings.
