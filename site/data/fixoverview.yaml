# The rows of the page "Important Fixes & Breaking Changes"
# (content/docs/compared-with-original/important-fixes.md), one per fixed
# original bug. The fields are described in site/README.md. The site build
# checks this file against the fixed-bugs pages
# (layouts/_partials/fix-overview/check.html).

levels:
  - level: 1
    name: Changes results
    text: A program that ran correctly with the original can compute, print, draw or write something else, take another way through its code, or stop. Check your sources for the commands named.
  - level: 2
    name: Noticeable change
    text: A program that ran correctly with the original still does its job, but something you may notice differs, such as the sound, a detail of the display or the events on a tape. Check whether your program needs adapting.
  - level: 3
    name: New runtime error
    text: A program that went wrong with the original stops with a runtime error instead, in most cases only with runtime error checking.
  - level: 4
    name: New compile error
    text: The compiler refuses a source that the original accepted, mostly with a wrong or random result.
  - level: 5
    name: Fix without side effects
    text: A crash, hang, leak or wrong result is fixed. A program that never met the bug behaves as before.

topics:
  - Graphics
  - Strings
  - "Numbers & dates"
  - Files
  - Input
  - "Windows & screens"
  - "Gadgets & menus"
  - Sound
  - Data structures
  - System
  - Compiler
  - Editor

