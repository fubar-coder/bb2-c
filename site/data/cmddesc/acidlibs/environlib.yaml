"WBWidth":
  text: The width in pixels of the Workbench screen when the program started.
"WBHeight":
  text: The height in pixels of the Workbench screen when the program started.
"WBDepth":
  text: The number of bitplanes of the Workbench screen when the program started.
"WBViewMode":
  text: The display mode of the Workbench screen when the program started, as the system's view mode bits (for example $8000 for high resolution, 4 for interlace).
"WBExtViewMode":
  text: The word that follows the view mode of the Workbench screen in the system's data, its sprite priority and extended modes.
"Processor":
  text: The processor of the Amiga, 0 for a 68000, 1 for a 68010, 2 for a 68020, 3 for a 68030 and 4 for a 68040.
"cr_vbr":
  text: The address of the processor's exception vectors (the vector base register) on a 68010 or higher, 0 on a 68000.
"ExecVersion":
  text: The version of the system's exec.library, which tells the version of AmigaOS.
