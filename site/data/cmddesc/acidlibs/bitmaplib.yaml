"BitMap":
  text: Makes a bitmap of the given width, height and depth in chip memory and makes it the used bitmap; a bitmap the object held before is freed. A depth of n gives 2 to the power of n colours, 8 for a depth of 3. With runtime error checking, a depth of 0 or more than 8 is the error "Illegal BitMap Depth", and a width or height below 1 the error "Illegal BitMap Size".
  notes: |
    The pointers to the bitplanes beyond the depth are cleared in the
    object.
"LoadBitMap":
  text: Loads an IFF ILBM picture into a bitmap that is already set up, and with `Palette#` its colours into that palette object. Amiga mode only.
  notes: |
    A file that cannot be opened is the error "Can't Open File", or "Can't
    Open IFF" with `Palette#`; a file without a picture header "Can't
    Find IFF 'BMHD'", one without picture data "Can't Find IFF 'BODY'",
    and one that ends inside the picture data "Can't Read File"; the file
    is closed before these errors.
"ScreensBitMap":
  text: Takes the bitmap of a screen as the bitmap object and makes it the used bitmap, so that the blitting and drawing commands draw on the screen. Every screen has a bitmap, also one opened without a bitmap object.
"ShapesBitMap":
  text: Takes the bitplanes of a shape as a bitmap and makes it the used bitmap, so that a program can draw into the shape.
"CopyBitMap":
  text: Makes the second bitmap a copy of the first, in chip memory of its own. The used bitmap does not change.
  notes: |
    With runtime error checking, a source bitmap without memory of its
    own (borrowed or not set up) is the error "Can't copy borrowed Bitmap".
"CludgeBitMap":
  text: Takes memory of the program, such as included data, as a bitmap of the given width, height and depth, with the planes one after the other, and makes it the used bitmap. The memory must be chip memory and large enough; the program is responsible for that. A game can take one block of memory at its start for all its bitmaps this way, instead of allocating and freeing them. With runtime error checking, a depth of 0 or more than 8 is the error "Illegal BitMap Depth", and a width or height below 1 the error "Illegal BitMap Size".
