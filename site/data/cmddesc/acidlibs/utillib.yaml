"CreateMsgPort":
  text: Makes a message port and returns its address; without memory for it, this is the error "Failed to allocate memory for Port", and without a free signal of the program "Failed to allocate signal for Port". With a name in `PortName$`, the port is public and other programs can find it by that name; with an empty name it is private.
"DeleteMsgPort":
  text: Deletes a message port made with `CreateMsgPort`.
  notes: |
    The messages still waiting at the port are replied first, so that
    their senders get them back. Kept from the original: anything else
    than a port of `CreateMsgPort` corrupts memory, also with runtime
    error checking
    ([#1041](https://github.com/fubar-coder/bb2-c/issues/1041)).
"Wait":
  text: Waits until one of the signals the program has, such as those of its message ports and windows, comes. As a function, it returns the signals that came.
"TaskName$":
  text: The name of the task or process at the address `task`; 0 is the program's own task.
  notes: |
    A task without a name gives the empty string.
