"CreateMsgPort":
  text: Makes a message port and returns its address; without memory for it, this is the error "Failed to allocate memory for Port". With a name in `PortName$`, the port is public and other programs can find it by that name; with an empty name it is private.
"DeleteMsgPort":
  text: Deletes a message port made with `CreateMsgPort`.
  notes: |
    Reply to the messages waiting at the port first. Kept from the
    original: anything else than a port of `CreateMsgPort` corrupts
    memory ([#299](https://github.com/fubar-coder/bb2-c/issues/299)).
"Wait":
  text: Waits until one of the signals the program has, such as those of its message ports and windows, comes. As a function, it returns the signals that came.
"TaskName$":
  text: The name of the task or process at the address `task`; 0 is the program's own task.
  notes: |
    Kept from the original: a task without a name reads from address 0
    ([#297](https://github.com/fubar-coder/bb2-c/issues/297)).
