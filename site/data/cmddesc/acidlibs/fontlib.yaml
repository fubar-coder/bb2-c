"BlitzFont":
  text: The object of an 8 by 8 font for text on bitmaps, as the introduction describes.
"LoadBlitzFont":
  text: Loads a font of 8 by 8 pixel characters, such as `topaz.font`, from `FONTS:` into a BlitzFont object, which becomes the font of the bitmap output. Amiga mode only.
  notes: |
    Only fonts of 8 pixels height with characters 8 pixels wide are
    accepted; any other font, or one that cannot be found, is the error
    "Can't Open Font". Kept from the original: a font refused for its size
    stays open ([#150](https://github.com/fubar-coder/bb2-c/issues/150)).
"BitMapOutput":
  text: Sends the output of `Print` and `NPrint` to the bitmap given, drawn with the used BlitzFont from the bitmap's cursor position.
  notes: |
    Each bitmap keeps its own cursor position. Kept from the original: a
    bitmap without bitplanes makes the output run very long
    ([#149](https://github.com/fubar-coder/bb2-c/issues/149)).
"Colour":
  text: The colours of the text on bitmaps, `Foreground Colour` for the characters and `Background Colour`, if given, for the space around them.
  notes: |
    The colour numbers are those of the bitmap; which colours they show
    depends on the palette of the slice (Blitz mode) or the screen
    (Amiga mode) that shows it.
"Locate":
  text: Moves the cursor of the bitmap output to column `X` and line `Y`, in characters from 0. `Y` may have a fraction, for example 1.5 for a line and a half down.
"CursX":
  text: The column of the cursor of the bitmap output, in characters, where the next character printed appears.
"CursY":
  text: The line of the cursor of the bitmap output, in characters, where the next character printed appears; it can have a fraction after a `Locate` with one.
"BitMapInput":
  text: Makes `Edit$` and `Edit` read their line on the output bitmap, with a cursor and the keys left, right, backspace, delete and return. The characters come from the input used before, normally the keyboard with `BlitzKeys On`. Blitz mode only.
  notes: |
    Use `BitMapOutput` before it. The line is returned without the spaces
    at its end. Kept from the original: when the input before ends, the
    editor waits forever
    ([#151](https://github.com/fubar-coder/bb2-c/issues/151)).
