"OpenSerial":
  text: Opens unit `unit#` of the serial device `device$` at the baud rate `baud`, with the flags `io_serflags`, and returns 0 if it cannot be opened, else the address of the unit's data in the library.
  notes: |
    The flags are the sum of 1 parity on, 2 odd parity (else even), 4
    seven wire handshake, 8 a break waits until the buffer is empty, 16
    high speed mode, 32 shared use of the port, 64 end of file checking
    and 128 no xON/xOFF. A unit that is already open is left as it is,
    and `OpenSerial` returns 0 for it, also with shared use.
"CloseSerial":
  text: Closes a unit opened with `OpenSerial`.
  notes: |
    A write that is still going on is stopped first.
"WriteSerial":
  text: Sends one byte to the unit, for a character for example `Asc("b")`, and waits until it is sent.
"WriteSerialString":
  text: Sends a string to the unit. With the flag 1, the command waits until the string is sent; without it, the program goes on at once. With the flag 2, the whole string is sent; without it, the string is sent up to its first zero byte. 3 sets both.
  notes: |
    The original took both meanings from the flag 2; a program written
    for it that passes 2 to wait passes 3. Before the next command that
    writes to the unit, a program waits for a write that does not wait,
    with `Wait` and `SerialEvent`. The form without flags takes the
    address of a string ending in a zero byte, and does not wait.
"WriteSerialMem":
  text: Sends `Length` bytes from memory at `Address` to the unit and waits until they are sent.
"ReadSerial":
  text: The next byte that came in on the unit, or -1 if none is waiting; with the flag 1 it waits for a byte. Use a word variable, as in `c.w=ReadSerial(0)`, to tell -1 from 255.
  notes: |
    The flag 2, which the original took for waiting, waits as well.
"ReadSerialString":
  text: All bytes waiting on the unit, as a string; an empty string if none is waiting.
  notes: |
    It reads at most what fits in the string buffer; the rest stays
    waiting for the next read.
"ReadSerialMem":
  text: Reads `Length` bytes from the unit into memory at `Address` and waits until they have come.
"SetSerialBuffer":
  text: Sets the size in bytes of the unit's read buffer.
"SetSerialLens":
  text: Sets the number of bits of a byte read and written and the number of stop bits of the unit.
"SetSerialParams":
  text: Passes the settings of the unit's request to the device again, for example after changing the request directly.
"SerialEvent":
  text: Whether a signal of the unit came at the last `Wait`, for a program that waits for several things at once; 2 for its read signal, 1 for its write signal, 0 if none has.
