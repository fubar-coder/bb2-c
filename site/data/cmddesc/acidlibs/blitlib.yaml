"Blit":
  text: Draws the shape into the used bitmap at the position, in the blit mode. With `Excessonoff`, the bitplanes of the bitmap beyond the shape's depth are set or cleared under the shape, one bit of the value for each of them.
"Block":
  text: Copies the shape into the used bitmap at the position as it is, without a mask; the x position is rounded down to a multiple of 16. It needs no cookie and is meant for shapes whose width is a multiple of 16, such as the tiles of a map.
"BlitColl":
  text: True (-1) if the shape at the position covers a pixel of the used bitmap that is not colour 0, else false (0). It follows the outline of the shape, so the bitmap should hold only what the shape may collide with. Test before blitting the shape itself.
"BlitMode":
  text: The blit mode of the following `Blit` commands, a value of the blitter's control register BLTCON0, with the minterm in bits 0 to 7 and the channels used in bits 8 to 11. `CookieMode`, `EraseMode`, `InvMode` and `SolidMode` give the usual ones. `Blit` uses channel A for the shape's cookie, B for its data, and C and D for the bitmap.
"CookieMode":
  text: The blit mode that draws the shape and leaves the background visible where the shape has colour 0; the start value.
"EraseMode":
  text: The blit mode that clears the bitmap where the shape has pixels.
"InvMode":
  text: The blit mode that inverts the bitmap where the shape has pixels.
"SolidMode":
  text: The blit mode that sets the bitmap where the shape has pixels.
