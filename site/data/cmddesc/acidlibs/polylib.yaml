"ChunkyCLS":
  text: Fills the whole chunky area of the used CopList with `color`.
"ChunkyPlot":
  text: Sets the pixel at `x,y` of the chunky area of the used CopList to `color`. With `CLIP`, a pixel outside the area is left alone; without it, nothing is checked.
"ChunkyVlin":
  text: Draws a vertical line in `color` from `y1` to `y2` at column `x` of the chunky area of the used CopList. With `CLIP`, the line is cut at the edges of the area.
  notes: |
    Kept from the original: without `CLIP`, a `y1` greater than `y2`
    writes far beyond the area
    ([#417](https://github.com/fubar-coder/bb2-c/issues/417)).
"ChunkyPoly":
  text: Draws a filled polygon of `numpts` points in `color` on the chunky area of the used CopList, with the blitter. With a fourth argument, whatever its value, it draws with the processor instead.
"BitMapPoly":
  text: Draws a filled polygon of `numpts` points in `color` on the used bitmap, with the blitter. With `ditherbitmap`, the colour is a pattern of two lines of that bitmap, from line `color` * 2 on.
  notes: |
    Kept from the original: the dither form expects bitplanes evenly
    spaced in memory, as `BitMap` makes them
    ([#418](https://github.com/fubar-coder/bb2-c/issues/418)).
"RenderToBitmap":
  text: Makes `RenderPoly` draw as `BitMapPoly` on the bitmap given, with the dither bitmap if it is given.
  notes: |
    Kept from the original: with a dither bitmap, the two bitmaps are
    swapped and `RenderPoly` draws on the dither bitmap
    ([#421](https://github.com/fubar-coder/bb2-c/issues/421)).
"RenderToChunky":
  text: Makes `RenderPoly` draw as `ChunkyPoly` on the chunky area of the CopList given, or with `split` on the second part of a split area. The colour is then a number from 0 to 14 for a fixed set of colours.
  notes: |
    Kept from the original: a colour above 14 reads beyond the set of
    colours ([#422](https://github.com/fubar-coder/bb2-c/issues/422)).
"RenderPoly":
  text: Draws a filled polygon of `numpts` points in `color` where `RenderToBitmap` or `RenderToChunky` chose.
  notes: |
    Kept from the original: before either of them it draws into a wrong
    place ([#420](https://github.com/fubar-coder/bb2-c/issues/420)).
