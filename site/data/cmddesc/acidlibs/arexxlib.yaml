"CreateRexxMsg":
  text: Makes an ARexx message and returns its address. `ReplyPort` is the address of the program's message port to which ARexx replies, `Exten` the file extension of the scripts (such as "rexx"), and `Host` the name of the host port.
"DeleteRexxMsg":
  text: Frees an ARexx message made with `CreateRexxMsg`.
"FillRexxMsg":
  text: Fills the 16 argument slots of an ARexx message from a NewType of a word of flags and 16 longs, given by its address. A set flag bit makes its slot a number; for a clear bit, the long is the address of a string, which becomes an ArgString. Bit 15 belongs to the first slot, bit 14 to the second, and so on.
  notes: |
    It is needed for function calls (RXFUNC) and other advanced uses of
    ARexx. A string address of 0 ends the list; a number 0 is stored like
    any other number. At most the 16 slots are filled.
"ClearRexxMsg":
  text: Deletes the ArgStrings in the 16 argument slots of an ARexx message and clears the slots. `RexxEvent` does this itself for a reply.
"CreateArgString":
  text: Makes an ArgString from a string and returns its address, which is that of the text.
  notes: |
    An ArgString holds at most 65535 characters; of a longer string it
    holds the first 65535.
"DeleteArgString":
  text: Frees an ArgString, whether the program or ARexx made it.
"SendRexxCommand":
  text: Sends an ARexx message to ARexx with `CommandString`, normally the name of a script, and the action codes the introduction describes. ARexx looks for the script also with the message's extension added.
"ReplyRexxMsg":
  text: Answers a command that came from an ARexx script, with the results `Result1` (0 for success) and `Result2`; if `Result1` is 0, `ResultString` can become the result string, as the note below says.
  notes: |
    `ResultString` becomes the result string only if the sender asked for
    one (the flag RXFF_RESULT in the action) and `Result1` is 0; it then
    takes the place of `Result2`. Otherwise the reply carries the number
    `Result2`.
"GetRexxResult":
  text: Result number `ResultNum` (1 or 2) of a message ARexx replied to; result 1 is 0 for success, else an error level.
  notes: |
    With runtime error checking, a `ResultNum` other than 1 or 2 is the
    error "Illegal Result Number".
"GetRexxCommand":
  text: The text of argument slot `ARGNum` of a message, from 1; slot 1 holds the command a script sent.
  notes: |
    With runtime error checking, an `ARGNum` outside 1 to 16 is the error
    "Illegal Argument Number".
"GetResultString":
  text: The result string of a message ARexx replied to; the ArgString is freed afterwards.
  notes: |
    The message's result field is cleared with it, so a second call gives
    the empty string.
"RexxEvent":
  text: Takes the next message from the message port at `PortAddress` and returns its address, or 0 if none is waiting; a reply is cleared with `ClearRexxMsg` first.
"IsRexxMsg":
  text: 1 if the message is an ARexx message, else 0; note that this true value is 1, not -1.
"RexxError":
  text: The text of an ARexx error code, such as the second result of a failed command.
