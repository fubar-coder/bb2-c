"LoadShape":
  text: Loads an IFF ILBM picture as a shape, and with `Palette#` its colours into that palette object. An IFF ANIM file gives its first frame in this shape and each further frame in the next shape number.
  notes: |
    Only ANIM files of the usual compression (method 5) are read; others
    give "ANIM format not supported". Each frame is made from the frame
    its header names: two frames back, as most ANIM files have it (double
    buffering), or the one before it, or any number of frames back. The
    frames go into the shape numbers up to the highest one; the rest of
    the animation is not loaded.

    A picture that does not fit a shape is the error "Can't Read/Write
    Shapes File", also without runtime error checking. The limits are
    those of `InitShape`:

    * The size of one plane with its extra word per row,
      (⌈width / 16⌉ × 2 + 2) × height bytes, must stay below 65536
      (64 KB); 992 by 528 pixels is too large.
    * The height is at most 1023 rows.
    * The width is at most 992 pixels.

    A picture whose header gives 0 bitplanes is the error "Illegal Shape
    Depth"; one whose header gives a width or a height of 0 is the error
    "Illegal Shape Size". Both are errors also without runtime error
    checking.

    "ANIM format not supported" comes after the first frame is loaded.
    The file is closed before the error, and the shape keeps the first
    frame.
"InitShape":
  text: Makes an empty shape of the given width, height and depth. With runtime error checking, a depth of 0 is the error "Illegal Shape Depth".
  notes: |
    With runtime error checking, a width or height of 0 is the error
    "Illegal Shape Size", and a shape too large the error "Shape too
    Big". These are the limits:

    * The size of one plane with its extra word per row,
      (⌈width / 16⌉ × 2 + 2) × height bytes, must stay below 65536
      (64 KB).
    * The height is at most 1023 rows.
    * The width is at most 992 pixels.
"GetaShape":
  text: Makes a shape from an area of the used bitmap.
  notes: |
    With runtime error checking, an area too large for a shape is the
    error "Shape too Big", with the limits of `InitShape`.
"CopyShape":
  text: Copies the first shape into the second.
"MakeCookie":
  text: Makes the cookie of the shape, the mask of all its pixels that are not colour 0.
"AutoCookie":
  text: With `On`, the shapes loaded or made from now on get their cookie automatically; `On` is the start value.
"Handle":
  text: Sets the handle of the shape, the point placed at the position given to drawing commands.
"MidHandle":
  text: Puts the handle of the shape in its middle.
"ShapeWidth":
  text: The width of the shape in pixels.
"ShapeHeight":
  text: The height of the shape in pixels.
"SaveShapes":
  text: Saves a range of shapes, from the first to the second number, into a file in Blitz's shapes format.
"LoadShapes":
  text: Loads shapes from a file saved with `SaveShapes`, into the range of shape numbers given, or from the first number on.
"DecodeShapes":
  text: Reads shapes in the format of `SaveShapes` from memory, such as data included in the program with `IncBin`. Data in chip memory is used where it is.
  notes: |
    With the address 0, the error is "Shapes file at memory location 0?
    NOWAY!".
"Shape":
  text: The object of a shape, as the introduction describes.
