"PopUpInit":
  text: Gives the menu windows a message port if they have none. The library makes one when the program starts, so this command is not needed.
  notes: |
    The argument is not used.
"PopUpWindow":
  text: Shows the menu whose first item is at the address `*items` at the top left corner of the screen object `Screen#`, and returns when a mouse button is pressed. As a function it returns the address of the item chosen, or 0 if none was.
  notes: |
    The item chosen is the one highlighted when the mouse button is
    pressed, in the menu or in one of its sub menus. Without free memory
    for a menu, or if a window cannot be opened, the whole menu closes
    at once and the function returns 0.
