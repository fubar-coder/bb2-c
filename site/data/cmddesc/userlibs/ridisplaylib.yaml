"InitView":
  text: Allocates a copper list in chip memory, writes its first four moves and returns its address, or 0 if there is not enough chip memory. The list is never shown.
  notes: |
    The list has 16 bytes per sprite and per bitplane, 8 bytes per
    colour and 38 more; the height is not part of its size. The four
    moves set the display window and the data fetch: DIWSTRT to `$2C81`, DIWSTOP to `$2CC1`, DDFSTRT to `$0038`
    and DDFSTOP to `$00D0`. Every call allocates a new list; all of them
    stay in memory until the end of the program, which frees them.
"ViewBitmap":
  text: Does nothing; the command was never written.
