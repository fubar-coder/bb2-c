"CludgeShapes":
  text: Makes `numshapes` shapes from `shape#` on out of shapes in memory at `address`, in the form `SaveShapes` writes (a 32-byte header and the data of each shape), and copies their data into chip memory. As a function it returns -1, or 0 if `numshapes` is 0.
  notes: |
    Shapes that are in use are freed first. A cookie is made for each
    shape while `LEAutoCookie` is on, which it is at the start.

    Kept from the original: an empty shape in memory (width or height 0)
    is skipped by 32 bytes plus the data size of the shape before it,
    even one of an earlier call, so the following shapes are read from
    the wrong place ([#809](https://github.com/fubar-coder/bb2-c/issues/809));
    a shape whose data size is 0 copies 64 KB and overwrites memory
    ([#808](https://github.com/fubar-coder/bb2-c/issues/808)).
"SafeToBlit":
  text: Returns -1 if the shape can be drawn at `x`,`y` in the current bitmap, else 0. The shape must have a cookie, `x` and `y` must not be negative, and the shape must fit into the bitmap's width and height.
  notes: |
    Kept from the original: the shape number is divided by 32 before it is
    compared with the maximum of shapes, so a shape number beyond the
    maximum is not refused
    ([#822](https://github.com/fubar-coder/bb2-c/issues/822)).
"LELoadShapes":
  text: Loads the shapes of an LE shapes file into the shapes from the first `shape#` to the second, or to the last shape if only one is given, and its palette into `palette#` if the file has one and a palette is given.
  notes: |
    Shapes in use are freed first. Packed shapes are unpacked; every shape
    gets a cookie. A file that is not an IFF file goes to `LoadShapes` of
    the shapes library. Nothing happens if the file cannot be opened.

    Kept from the original:

    * The form `shape#,filename$,palette#` does not load the palette into
      the palette named, but into an unknown one; use the form with both
      shape numbers instead
      ([#812](https://github.com/fubar-coder/bb2-c/issues/812)).
    * A file that is not an IFF file loads only one shape, into the last
      shape of the range
      ([#813](https://github.com/fubar-coder/bb2-c/issues/813)).
    * Loading into a shape whose data is linked into memory, as
      `LECludgeShapes` makes them, reads that shape's data from a wrong
      address and ends the command early without closing the file; a
      second such shape makes the command return into the program's stack
      ([#807](https://github.com/fubar-coder/bb2-c/issues/807)).
    * A palette chunk of fewer than 3 bytes writes 65536 colours over
      memory ([#820](https://github.com/fubar-coder/bb2-c/issues/820)).
"LESaveShapes":
  text: Saves the shapes from the first `shape#` to the second as an LE shapes file, with the colours of `palette#` if it is given. The data is packed while `LECompressShapes` is on.
  notes: |
    A shape that the packer cannot pack is stored unpacked.
    Nothing happens if the file cannot be opened.

    Kept from the original:

    * The number of shapes stored in the file is taken from the shape
      numbers divided by 32, so the file loads back only about one shape
      per 32 shape numbers
      ([#815](https://github.com/fubar-coder/bb2-c/issues/815)).
    * Whether the palette is written depends on what the system's file
      write routine leaves behind; on OS 3.2 it is written
      ([#814](https://github.com/fubar-coder/bb2-c/issues/814)).
    * The length of the IFF file in its header is 8 too large, and after
      a save with a palette, a later save without one still counts that
      palette's size
      ([#816](https://github.com/fubar-coder/bb2-c/issues/816)).
    * A buffer is allocated with a size that depends on leftovers and
      freed with another size
      ([#817](https://github.com/fubar-coder/bb2-c/issues/817)).
    * A palette of 0 colours copies 65536 colours and overwrites memory
      ([#823](https://github.com/fubar-coder/bb2-c/issues/823)).
"LECompressShapes":
  text: Switches the packing of `LESaveShapes` on (`True`) or off (`False`). It is off at the start.
"LECludgeShapes":
  text: Decodes an LE shapes file that is in memory at `address` into the shapes from the first `shape#` to the second, and its palette into `palette#`.
  notes: |
    Shapes in use are freed first, and every shape gets a cookie. If the
    file is not packed and lies in chip memory (below 2 MB), the shapes
    use the data where it is instead of a copy, unless `copymemflag` is
    negative (-1): then the data is always copied into chip memory. Packed
    data is always unpacked into chip memory. Nothing happens if the
    memory does not hold an LE shapes file.

    Kept from the original: a palette chunk whose size is not a multiple
    of 3 makes the command miss the shape data, and nothing is loaded
    ([#811](https://github.com/fubar-coder/bb2-c/issues/811)); decoding
    into a shape whose data is linked into memory reads that shape's data
    from a wrong address and ends the command early, and a second such
    shape makes the command return into the program's stack
    ([#807](https://github.com/fubar-coder/bb2-c/issues/807)).
"LEInitShape":
  text: Makes an empty shape of the given width, height and depth, with cleared data and cookie in chip memory and both handles at 0.
  notes: |
    A shape in use is freed first. The cookie is cleared, not made from
    the data.
"LEScanShapes":
  text: Finds the largest width, height and depth among the used shapes from `startshape#` to `endshape#`, for `LEMaxShapeWidth`, `LEMaxShapeHeight` and `LEMaxShapeDepth`.
"LEMaxShapeWidth":
  text: The largest width found by the last `LEScanShapes`.
"LEMaxShapeHeight":
  text: The largest height found by the last `LEScanShapes`.
"LEMaxShapeDepth":
  text: The largest depth found by the last `LEScanShapes`.
"LEAutoCookie":
  text: Switches the cookies that `CludgeShapes` and `CludgeShapesToAddress` make on (any value but 0) or off (0). It is on at the start.
"CludgeShapesToAddress":
  text: Like `CludgeShapes`, but the shapes are made in `numshapes` shape objects of 32 bytes each at `Address`, memory of the program's own, instead of in the shape objects of Blitz Basic. As a function it returns -1, or 0 if `numshapes` is 0.
