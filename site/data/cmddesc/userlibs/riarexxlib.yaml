"RXCreatePort":
  text: Makes the program's public message port with the name `name$`. Returns the port's address, or 0 if the program has a port already, a public port of that name exists, or the port cannot be made.
"RXDeletePort":
  text: Removes the program's message port. Messages that are still waiting are replied with the return code 5 first.
  notes: |
    Kept from the original: the command does not wait for the replies to
    commands sent with `RXRunCommand` or `RXRunScript` that are still
    with their receivers, and neither does the end of the program; a
    reply that comes later goes to the deleted port
    ([#1095](https://github.com/fubar-coder/bb2-c/issues/1095)).
"RXReadPort":
  text: Takes the messages that have arrived at the port and makes the next one the current message. Returns its address, or 0 if no message is waiting.
  notes: |
    Replies to the program's own messages are handled here too. Anything
    at the port that is neither a message nor a reply is replied at once,
    and the reading stops there.

    Kept from the original: the library's list of received messages has
    room for 31; when more are waiting in it, the further ones are
    written past its end, over other memory
    ([#1100](https://github.com/fubar-coder/bb2-c/issues/1100)).
"RXWaitPort":
  text: Like `RXReadPort`, but waits for a message if none is waiting. Returns the address of the new current message, or 0 if only replies to the program's own messages arrived.
"RXReplyMsg":
  text: Replies to the current message with the return code `errcode`, 0 for no error, and the optional result string `result$`. Nothing happens if there is no current message.
  notes: |
    Read the arguments of a message before replying to it: after the
    reply there is no current message, and `RXGetArg`, `RXNextArg`,
    `RXNumArgs` and `RXSendersName` give 0 or an empty string until the
    next `RXReadPort` or `RXWaitPort`.

    The result string goes back only if the sender asked for one and
    `errcode` is 0. The reply goes to the port named in the message; if
    no such port exists any more, the message is not replied.
"RXRunCommand":
  text: Sends `command$` to the port `portname$`, or to the default port, and does not wait for the reply. Returns -1 when the command was sent, and 0 if the port is not found or the command cannot be sent.
  notes: |
    The library frees the reply when it arrives, at the next
    `RXReadPort`, `RXWaitPort` or `RXSendCommand`. Up to 31 commands
    sent this way can wait for their replies; while 31 do, the command
    sends nothing and returns 0.
"RXSendersName":
  text: The name stored in the current message, which for messages sent by this library is the name of the sender's port. An empty string if there is no current message.
"RXSendCommand":
  text: Sends `command$` to the port `portname$`, or to the default port, waits for the reply and returns its result string. An empty string if the port is not found, the command failed or the reply has no result; `RXReturnCode` gives the return code.
  notes: |
    Messages that arrive while the command waits are kept for
    `RXReadPort` and `RXWaitPort`.
"RXNumArgs":
  text: The number of arguments of the current message, 0 if there is no current message.
"RXGetArg":
  text: The argument `argnum`, 1 to 16, of the current message. An empty string if there is no such argument or no current message.
"RXExecuteScript":
  text: Runs the ARexx script `scriptname$` through ARexx and waits until it has ended. Returns -1 when the script was sent, 0 if ARexx is not running; `RXReturnCode` gives the script's return code.
  notes: |
    The message always goes to the port `REXX`, not to the default port.
    Messages that arrive while the command waits are kept for
    `RXReadPort` and `RXWaitPort`. A script that sends a command to the
    program's own port and waits for the reply cannot be run this way,
    because both would wait for each other; use `RXRunScript` for it.
"RXRunScript":
  text: Runs the ARexx script `scriptname$` through ARexx, without waiting. Returns -1 when the script was sent, 0 if ARexx is not running.
  notes: |
    The message always goes to the port `REXX`, not to the default port.
    The notes of `RXRunCommand` apply too.
"RXDefaultPort":
  text: Sets the port that `RXRunCommand` and `RXSendCommand` send to when they are given no port name. It is `REXX` at the start of every run.
"RXNextArg":
  text: The next argument of the current message, starting with the first. An empty string after the last one.
"RXReturnCode":
  text: The return code of the reply to the last `RXSendCommand` or `RXExecuteScript`, 0 when it succeeded.
"RXTokenise":
  text: With `On`, the default, commands are split into words, each sent as an argument of its own; with `Off`, a command is sent as one argument.
  notes: |
    Spaces separate the words. Text between two quote characters is one
    word, and inside it a doubled quote character stands for one quote;
    the character right after the closing quote starts the next word. An
    empty quoted word is sent as an empty argument.

    A message has at most 16 arguments: with more words, the 16th
    argument holds the rest of the command as it is, for the receiver to
    split. Commands and words can be of any length.
"RXMessageList":
  text: The address of the library's list of received messages that have not yet become current, a list of message addresses ending with 0; 0 before `RXCreatePort`.
"RXQuoteChar":
  text: Sets the quote character that groups words when commands are split, the first character of `char$`. It is `"` at the start; `'` saves typing `Chr$(34)`.
