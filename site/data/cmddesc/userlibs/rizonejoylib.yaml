"ZoneInit":
  text: Clears all zones of the current zone table, or one zone, or the zones from `start_num` to `end_num`. A cleared zone contains no point.
"SetZone":
  text: Defines a zone of the current table - a rectangle with the corners `x1,y1` and `x2,y2`, or a circle around `x,y` with `radius`. As a function it returns -1 if the zone was set and 0 if it was refused.
  notes: |
    The corners of a rectangle may be given in any order; the guide's
    "x2,y2 should be the bottom left" means the bottom right corner. The
    edges belong to the zone.

    The zone is refused, and nothing is stored, for a zone number
    beyond the table or below 0, a radius outside 0 to 255, a rectangle
    whose bottom edge is -1, which marks a circle in the table, and when
    there is no zone table at all.
"Zone":
  text: The number of the first zone of the current table that contains the point `x,y`, or -1 if there is none.
  notes: |
    The 68000 and the 68020 mode give the same result for every zone
    that `SetZone` makes.

    Kept from the original: the distance of a point from the centre of a
    circle is computed in 16 bits, so a point more than 32767 pixels away
    from it can be found inside the circle
    ([#1153](https://github.com/fubar-coder/bb2-c/issues/1153)).
"ZoneTest":
  text: Like `Zone`, testing only the zone `start_num`, or the zones from `start_num` to `end_num`. Returns the number of the first zone that contains `x,y`, or -1.
  notes: |
    In the form with a range, a `start_num` beyond the table, or below
    0, counts as the last zone, and an `end_num` beyond the table or
    below 0 gives -1. A single zone beyond the table gives -1.
"ZoneTable":
  text: The address of the current zone table, or 0 if there is none. The table starts with the number of zones as a long; then each zone takes 8 bytes, the words x1, x2, y1 and y2.
  notes: |
    A circle keeps its centre in x1 and y1, the radius squared in x2 and
    -1 in y2; a cleared zone has -1 in x1. Table 0, with its 256 zones,
    takes 2052 bytes.

    The guide differs: it gives the order x1, y1, x2, y2 with the radius
    of a circle at +4, and 16 bytes for each zone.
"JFire":
  text: The fire buttons of a joystick port - 0 none, 1 the first button, 2 the second, 3 both. Ports 3 and 4 of the four player adaptor have one button.
"JVert":
  text: The vertical direction of a joystick port - -1 up, 1 down, 0 none.
"JHoriz":
  text: The horizontal direction of a joystick port - -1 left, 1 right, 0 none.
"AllFire":
  text: The first fire buttons of the four ports as bits - bit 0 port 1, bit 1 port 2, bit 2 port 3, bit 3 port 4. A bit is set while the button is pressed.
  notes: |
    With `joybits`, only the ports whose bits are set are tested; for
    example `AllFire(%0011)` tests ports 1 and 2.
"ZoneTableSize":
  text: The number of zones of the current zone table, or 0 if there is none.
"NewZoneTable":
  text: Creates zone table `table#` (1 to 15) with `num_zones` zones (1 to 65535), all cleared, freeing a table of that number first. Returns -1 if it worked, else 0; the new table does not become the current one.
  notes: |
    A table that replaces the current one stays the current table. If
    there is not enough memory for a table that replaces another, the
    table of that number no longer exists, and if it was the current
    table, table 0 becomes the current one.

    The guide gives 65536 zones as the largest size; the library takes
    at most 65535.
"UseZoneTable":
  text: Makes zone table `table#` the current one, for all zone commands. Returns -1 if it worked and 0 if there is no such table.
"FreeZoneTable":
  text: Frees zone table `table#` (1 to 15) and makes table 0 the current one. Returns -1 if it worked, else 0.
  notes: |
    Table 0 becomes the current one also when another table than the
    freed one was current, as the guide says; choose that table again
    with `UseZoneTable`.
"ZoneTableNumber":
  text: The number of the current zone table.
"ZoneMode":
  text: Returns -1 when zones are tested with the 68020 method and 0 when with the 68000 method. The 68020 method is the default on a 68020 or later processor.
"SetZoneMode":
  text: Chooses the zone test method - -1 for the 68020 method, 0 for the 68000 method. On a 68000 or 68010 the command does nothing.
"JAdaptorStatus":
  text: Switches the reading of ports 3 and 4 of the four player adaptor on (-1) or off (0); while it is off, they read as nothing pressed. As a function it returns the previous setting. It is on at the start.
"GetZoneX1":
  text: The x1 value of a zone of the current table - the left edge of a rectangle, the centre of a circle, -1 for a cleared zone.
  notes: |
    For a zone beyond the table, or without a zone table, the result is
    -1.
"GetZoneY1":
  text: The y1 value of a zone of the current table - the top edge of a rectangle, the centre of a circle, -1 for a cleared zone.
  notes: |
    For a zone beyond the table, or without a zone table, the result is
    -1.
"GetZoneX2":
  text: The x2 value of a zone of the current table - the right edge of a rectangle, the radius squared of a circle, -1 for a cleared zone.
  notes: |
    For a zone beyond the table, or without a zone table, the result is
    -1.
"GetZoneY2":
  text: The y2 value of a zone of the current table - the bottom edge of a rectangle, -1 for a circle or a cleared zone.
  notes: |
    For a zone beyond the table, or without a zone table, the result is
    -1.
"ReadJoyPad":
  text: The extra buttons of a CD32 pad in port 1 or 2, as bits - 2 play/pause, 4 reverse, 8 forward, 16 green, 32 yellow, 64 red, 128 blue.
  notes: |
    Every port number other than 2 reads port 1, the joystick port. The
    guide names 1 and 2, but its own example reads the pad with
    `ReadJoyPad(0)`.
