"RetrieveCallHook":
  text: The address of the library's listview render hook, for the `h_Entry` field of a `Hook` structure whose `h_Data` points to a field table. Call it before the hook is used.
  notes: |
    A text field whose pointer is 0 stays empty, as a bitmap field whose
    pointer is 0. A right-aligned text or bitmap ends one pixel before
    the right edge of its field. The hook draws the tree lines with a dotted line
    pattern and puts the RastPort's own pattern back afterwards.
