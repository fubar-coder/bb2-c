"SerialBaud":
  text: Sets the baud rate of the serial port, for example 9600.
  notes: |
    The rate is calculated from the clock of a PAL Amiga.
"SerialOpen":
  text: Installs the library's receive and transmit interrupts and empties both buffers; with `baudrate`, it sets the baud rate first. A port already open keeps its interrupts and buffers; `SerialOpen baudrate` still sets the rate.
  notes: |
    Without `baudrate` the port keeps the rate it has, from `SerialBaud`
    or from the system. On a 68010 or later processor the interrupts are
    installed in the vector table the processor uses, also when it has
    been moved.
"SerialClose":
  text: Removes the library's interrupts and puts back the ones that were there before. Nothing happens if the port is not open.
  notes: |
    The library's two serial interrupts are switched off and back on if
    they were on at `SerialOpen`; the other interrupts stay as they are.
"SerialRead":
  text: The next received byte from the buffer, 0 to 255, or -1 if the buffer is empty. It does not wait.
"SerialWrite":
  text: Puts a byte into the transmit buffer; the library's interrupt sends it in the background.
  notes: |
    The transmit buffer holds 127 bytes not sent yet. When it is full and
    the port is open, the command waits until the interrupt has sent a
    byte; with the interrupts disabled it then waits for ever, so send no
    more than 127 bytes there. With the port closed it does not wait.
"SerialVersion":
  text: The version of the library, 1.
"SerialBuffer":
  text: The address of the receive buffer, 256 bytes used as a ring.
"SerialSendBlock":
  text: Sends `length` bytes from `address`, one after the other. `SerialProgress` gives the number of bytes still to send, and `SerialStop` ends the block early.
  notes: |
    The command opens the port if it is closed. A length of 0 or less
    sends nothing.
"SerialReceiveBlock":
  text: Waits for `length` bytes and stores them from `address` on. `SerialProgress` gives the number still to come, and `SerialStop` ends the block after the next byte.
  notes: |
    The command opens the port if it is closed. The bytes already waiting
    in the receive buffer are the first of the block; call `SerialFlush`
    first to receive only bytes that arrive after the call. A length of 0
    or less receives nothing.
"SerialFlush":
  text: Empties the receive buffer.
  notes: |
    The command opens the port if it is closed, and leaves it open.
"SerialSendString":
  text: Sends the characters of a string, without a 0 byte behind them.
  notes: |
    The command opens the port if it is closed. If the other machine
    reads with `SerialReadString`, send the 0 byte that ends the string
    with `SerialWrite 0`.
"SerialReadString":
  text: Waits for characters up to a 0 byte and returns them as a string, without the 0.
  notes: |
    The command opens the port if it is closed. The string ends at the
    end of the string work area (10240 bytes unless the compiler options
    set another size); the characters that do not fit stay in the
    receive buffer.
"SerialProgress":
  text: The number of bytes still to send or receive of the last `SerialSendBlock` or `SerialReceiveBlock`.
"SerialReadLong":
  text: Waits for four bytes and returns them as a long, the low byte first.
  notes: |
    The command opens the port if it is closed. It reads what
    `SerialWriteLong` sends.
"SerialWriteLong":
  text: Sends a long as four bytes, the low byte first.
  notes: |
    The command opens the port if it is closed.
"SerialStop":
  text: Ends a `SerialSendBlock` or `SerialReceiveBlock` that is running, for example from an interrupt. Called while no block runs, it has no effect on the next one.
"SerialGot":
  text: The number of received bytes waiting in the buffer, 0 to 255.
  notes: |
    The buffer keeps up to 255 bytes; bytes that arrive while it is full
    are lost.
"SerialWait":
  text: Waits until a byte has been received and returns it, 0 to 255.
