"InitSerialIO":
  text: Prepares the serial port for the library - sets the baud rate, the number of bytes `DoSerialIO` exchanges and the input and output buffers, and switches the system's serial interrupts off. As a function it returns -1 if it set the port up, else 0.
  notes: |
    A second call without `FinitSerialIO` in between does nothing and
    returns 0, and so does a baud rate outside 109 to 3546895.
"FinitSerialIO":
  text: Ends the serial transfers started with `InitSerialIO` and switches the system's serial interrupts that were on before back on; it is called by itself when the program ends.
"SetSerialMode":
  text: Makes this machine the master (-1) or the slave (0) for `DoSerialIO`. The master sends each byte before it receives one, the slave the other way round.
"EndSerialIO":
  text: Does nothing.
"PutSerial":
  text: Sends one byte, or `bytes` bytes from `address`, waiting until the port can take each one. Nothing is sent before `InitSerialIO`.
  notes: |
    A block of 0 bytes sends nothing.
"GetSerial":
  text: Without arguments, waits for a byte and returns it. With `address,bytes`, waits for that many bytes, stores them from `address` on and returns -1.
  notes: |
    Before `InitSerialIO` both forms return 0 at once, and the block form
    also for a block of 0 bytes.
"FlushSerialIO":
  text: Throws away a byte waiting at the serial port.
"SyncSerial":
  text: Synchronises with the other machine on the byte `syncbyte` and decides which is the master. Returns -1 if this machine is the master and 0 if it is the slave.
  notes: |
    The machine that is started second, and finds the other's sync byte
    already waiting, becomes the slave. Kept from the original: when
    both start at the same moment, both become the master
    ([#655](https://github.com/fubar-coder/bb2-c/issues/655)).
"DoSerialIO":
  text: Exchanges the buffers of `InitSerialIO` with the other machine, byte for byte. Without an argument it transfers the number of bytes given to `InitSerialIO` or to the last `SetIOSize`, nothing for 0; with an argument, that number plus 1.
  notes: |
    Both machines must call it at the same time, one as the master and
    one as the slave (`SetSerialMode`). Nothing happens before
    `InitSerialIO`.
"SetIOBuffers":
  text: Sets the input and output buffers that `DoSerialIO` uses.
"SetIOSpeed":
  text: Changes the baud rate after `InitSerialIO`; before it, nothing happens.
  notes: |
    A baud rate outside 109 to 3546895 is refused.
"SetIOSize":
  text: Sets the number of bytes that `DoSerialIO` without an argument transfers.
"CheckSerial":
  text: The byte waiting at the serial port, or -1 if there is none or `InitSerialIO` was not called. It does not wait.
"SyncPut":
  text: Sends `bytes` bytes from `address`, waiting after each one for the other machine's answer, so that a slow receiver loses nothing. The other machine receives them with `SyncGet`.
  notes: |
    A block of 0 bytes sends nothing.
"SyncGet":
  text: Receives `bytes` bytes to `address`, answering each one, as the partner of `SyncPut`.
  notes: |
    A block of 0 bytes receives nothing.
