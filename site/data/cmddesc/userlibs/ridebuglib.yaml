"AddVarTrace":
  text: Adds a variable to the debugger's list of traces. `variable` is the variable itself, `string$` the name shown in the variable trace window, and `output` the way its value is shown.
  notes: |
    The name need not be the variable's name: `"a (counter)"` reminds
    you what `a` is used for. The type of the variable is passed along
    automatically. For a number, `output` 1 shows it in decimal, 2 in
    hexadecimal and 3 in binary (quicks and floats only in decimal); for
    a string, 2 also shows its length and maximum length. An `output`
    of 0 is sent as 1. The same variable can be added more than once,
    for example to see it in decimal and in hexadecimal.

    Kept from the original: an empty name takes the characters behind it
    in memory up to the next 0
    ([#612](https://github.com/fubar-coder/bb2-c/issues/612)); a name
    longer than 251 characters is not cut and overwrites the memory
    behind the library's message
    ([#613](https://github.com/fubar-coder/bb2-c/issues/613)); a variable
    whose type is not one of the basic types reaches the debugger with a
    random type ([#609](https://github.com/fubar-coder/bb2-c/issues/609)).
"DelVarTrace":
  text: Removes all traces with the name `variable$` from the debugger's list. The name must be the one given to `AddVarTrace`, which need not be the variable's.
  notes: |
    Kept from the original: the name reaches the debugger four bytes too
    far on, behind bytes left from the previous instruction, so the
    debugger may not find the trace
    ([#610](https://github.com/fubar-coder/bb2-c/issues/610)). As with
    `AddVarTrace`, an empty name takes the characters behind it
    ([#612](https://github.com/fubar-coder/bb2-c/issues/612)) and a long
    name is not cut
    ([#613](https://github.com/fubar-coder/bb2-c/issues/613)).
"VarTraceWindow":
  text: Opens the debugger's variable trace window.
"DisAsmWindow":
  text: Opens the debugger's disassembly window at the place of this command in the program. This helps where the address of a label cannot be found, as inside an assembler statement or function.
  notes: |
    Kept from the original: the search for the place of the command has
    no limit ([#611](https://github.com/fubar-coder/bb2-c/issues/611)).
"CopperTrace":
  text: Opens the debugger's copper window at `address`. With `offset`, `address` is that of a copper list object, and the window opens at the copper list whose address is the long at `address` plus `offset`.
  notes: |
    Nothing happens if `address`, or the long read with `offset`, is 0.
    To open the window at the start of copper list 0:

    ```blitzbasic
    CopperTrace Addr CopList(0),4
    ```
"ProcControl":
  text: Switches the debugger's procedure control on or off; without an argument, it toggles it. With procedure control on, the debugger runs statements and functions as single commands instead of stepping or tracing through them.
  notes: |
    This is the same as the procedure control gadget of the debugger.
"MemoryWindow":
  text: Opens the debugger's memory window `num` (0 or 1) at `address`, or moves it there if it is open.
