"AddVarTrace":
  text: Adds a variable to the debugger's list of traces. `variable` is the variable itself, `string$` the name shown in the variable trace window, and `output` the way its value is shown.
  notes: |
    The name need not be the variable's name: `"a (counter)"` reminds
    you what `a` is used for. The type of the variable is passed along
    automatically. `output` is passed on to the debugger as it is; an
    `output` of 0 is sent as 1. A name longer than 251 characters is cut
    to 251.

    Kept from the original: a variable whose type is not one of the
    basic types reaches the debugger with a meaningless type
    ([#609](https://github.com/fubar-coder/bb2-c/issues/609)).
"DelVarTrace":
  text: Asks the debugger to remove the trace with the name `variable$` from its list. The name must be the one given to `AddVarTrace`, which need not be the variable's.
  notes: |
    As with `AddVarTrace`, a name longer than 251 characters is cut to
    251.
"VarTraceWindow":
  text: Opens the debugger's variable trace window.
"DisAsmWindow":
  text: Opens the debugger's disassembly window at the place of this command in the program.
  notes: |
    The command takes no address: the form `DisAsmWindow address` that
    the RI Debug Lib guide gives does not compile. The window opens at
    the `DisAsmWindow` statement itself, not at the command after it as
    the guide says.

    Kept from the original: the search for the place of the command has
    no limit ([#611](https://github.com/fubar-coder/bb2-c/issues/611)).
"CopperTrace":
  text: Opens the debugger's copper window at `address`. With `offset`, `address` is that of a copper list object, and the window opens at the copper list whose address is the long at `address` plus `offset`.
  notes: |
    Nothing happens if `address`, or the long read with `offset`, is 0.
    To open the window at the start of copper list 0:

    ```blitzbasic
    CopperTrace Addr CopList(0),4
    ```
"ProcControl":
  text: Switches the debugger's procedure control on or off; without an argument, it toggles it.
"MemoryWindow":
  text: Opens the debugger's memory window `num` at `address`.
