"RIAnimInit":
  text: Starts an animation held in memory at `address` - unpacks its first frame into the bitmap and copies its palette into the palette object. Returns -1 on success, 0 if the data is not an animation with a first frame and a bitmap header, its width is 0 or its depth 0 or above 8, or the bitmap is too narrow or not deep enough for the first frame.
  notes: |
    The optional position is either a byte offset into the bitplanes,
    (x/8)+y*(bytes per row), or a pixel position `x`,`y`; x is rounded
    down to a multiple of 8. The frames that `RINextAnimFrame` draws use
    the same position. With runtime error checking, an `x`,`y` outside
    the bitmap stops the program with the runtime error "Animation
    position outside the bitmap"; nothing checks that the whole
    animation fits into the bitmap at the position.

    The bitmap header must be in the first frame. After a failed call
    there is no animation: `RIAnimFrameCount` and `RINextAnimFrame`
    return 0.
"RINextAnimFrame":
  text: Changes the bitmap into the next frame of the animation started with `RIAnimInit`; a new palette of the frame goes into the palette object given to `RIAnimInit`. Returns -1 if a frame was drawn, 0 if not.
  notes: |
    After the last frame it goes on with the third frame if `AnimLoop` is
    on, the default, and returns 0 if it is off. Animations end with two
    loop frames that lead back to the start; without them, keep
    `AnimLoop` off. It also returns 0 before an `RIAnimInit`, for a
    frame of another delta format, for a frame without delta data and
    for one whose chunks claim to be longer than the frame. Other chunks
    between the frames, or before the delta data of a frame, are
    skipped. ANIM7 is played with short (word) and with long data.

    Not fixed: an ANIM7 animation with long data whose width is no
    multiple of 32 pixels loses its right edge, and one narrower than 32
    pixels writes far beyond the bitmap
    ([#1115](https://github.com/fubar-coder/bb2-c/issues/1115)). Kept
    from the original on purpose: a run or copy count of 0 in the delta
    data counts as 256 rows; the ANIM format does not define a count of
    0, and encoders do not write one
    ([#508](https://github.com/fubar-coder/bb2-c/issues/508)).
"AnimLoop":
  text: With `On`, the default at the start of every run, `RINextAnimFrame` goes on with the third frame after the last one; with `Off` it stops there.
"RIAnimFrameCount":
  text: The number of frames of the animation started with `RIAnimInit`, 0 before the first `RIAnimInit`.
"RIAnimDepth":
  text: The number of bitplanes of the animation at `address`, 0 if it is not an animation with a bitmap header.
"RIAnimWidth":
  text: The width in pixels of the animation at `address`, 0 if it is not an animation with a bitmap header.
"RIAnimHeight":
  text: The height in pixels of the animation at `address`, 0 if it is not an animation with a bitmap header.
