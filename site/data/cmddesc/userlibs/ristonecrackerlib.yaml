"STCLength":
  text: The unpacked length, in bytes, of the StoneCracker 4.04 file at `address` in memory; 0 if `address` holds no such file.
"STCStart":
  text: The address where the data of the StoneCracker 4.04 file at `address` begin once it is unpacked in place; 0 if `address` holds no such file.
  notes: |
    Use it after `STCDecrunch` with one argument: unpacked in place, the
    data lie at a small offset behind the start of the file.
"STCSafeLen":
  text: The smallest buffer, in bytes, in which the StoneCracker 4.04 file at `address` can be unpacked in place; 0 if `address` holds no such file.
  notes: |
    A smaller buffer is overwritten past its end when the file is
    unpacked.
"STCLoad":
  text: Loads the StoneCracker 4.04 file `filename$` to the memory at `address` and unpacks it there in place. As a function it returns the address of the unpacked data, as `STCStart` does, or 0 if the file could not be opened.
  notes: |
    The program provides the buffer; it must hold `STCSafeLen` bytes
    and the whole file, which is read whatever its length.

    Kept from the original: the file is not checked to be a StoneCracker
    file, so any other file is "unpacked" too and can overwrite memory
    anywhere ([#836](https://github.com/fubar-coder/bb2-c/issues/836));
    a failed read is not noticed either. After the load, the file's lock
    is freed a second time, which the operating system does not expect
    ([#835](https://github.com/fubar-coder/bb2-c/issues/835)).
