"TrackInit":
  text: Prepares the Protracker module at `address` in chip memory, from the first song position, and enables playing. The module plays as the program calls `TrackPlay`.
  notes: |
    The module is not checked; it must be a module with 31 samples in the
    "M.K." format. `TrackInit` corrects two kinds of invalid data in the
    module in memory: sample numbers above 31 in the patterns become 0,
    and a sample's finetune above 15 keeps only its low four bits.

    `TrackInit` also works while the player is switched off with
    `Tracker Off`; `Tracker On` then plays this module.
"TrackPlay":
  text: Plays one tick of the module. Call it 50 times a second, for example from a vertical blank interrupt handler (`SetInt 5`).
  notes: |
    Nothing happens unless a module was started with `TrackInit` and the
    player is not paused, stopped or switched off.

    The speed commands of a module (`F01` to `F1F`) set the number of
    ticks per row. A tempo command (`F20` to `FFF`) does not change the
    speed: the speed is how often the program calls `TrackPlay`.
"TrackStop":
  text: Stops the module and silences the four voices.
  notes: |
    `TrackerPause 0` continues it, and `TrackInit` starts it from the
    beginning.
"TrackDMA":
  text: Sets how long the play routine waits for the sound hardware after starting a sample, as a loop count; the default is 4000.
  notes: |
    The wait is a busy loop, so how long it takes depends on the
    processor.
"Tracker":
  text: Switches the player off with 0 and on with any other value. Switching it off stops the module and silences the voices; switching it on again continues it.
  notes: |
    The player starts switched on. A module that was stopped or paused
    before `Tracker Off` stays stopped or paused after `Tracker On`.
"TrackerChannels":
  text: Chooses the voices the module plays on, bit 3 for voice 1 down to bit 0 for voice 4; the default is 15, all four. A voice left out is silenced at once.
  notes: |
    The module does not write to a voice left out, so the program can
    play its own sounds on it; the other voices play their own notes.
    `TrackerChannels %0111`, for example, leaves voice 1 free.
"TrackerPause":
  text: Pauses the module with any value other than 0, which silences the voices; with 0 it continues the module and plays one tick at once.
