"FNSPrint":
  text: Prints a text in the font of slot `fontnum` at `x`,`y` (plus the origin of `FNSOrigin`) into the bitmap chosen with `FNSOutput`. The text is a string or the address of a text in memory that ends in a zero byte.
  notes: |
    `prefs` and `colour` set the style and the colour for this print
    only; without them, those of `FNSPrefs` and `FNSInk` are used. If the
    slot holds no font, or before `FNSOutput` has chosen a bitmap,
    nothing is printed. A character the font has no glyph for is printed
    as a space. The underline is clipped to the clipping zone like the
    characters, and an empty line is neither underlined nor centred.
"InstallFNS":
  text: Puts the FNS font at `address` in memory into slot `fontnum` and returns the slot number, or 0 if there is no FNS font at the address or its height is 0. `characters` is the number of glyphs the font has, from the space on; without it, the font counts as one of 91 glyphs, from the space to `z`, like every known FNS font.
  notes: |
    Only the low 4 bits of `fontnum` count, so 16 is slot 0 again. The
    font stays where it is and must stay in memory while the slot is
    used. A character behind the glyphs is printed and measured as a
    space. `characters` goes from 1 to 224; 0 counts as 1 and a larger
    number as 224. The third parameter is a form of the BB2 C port; the
    original had only the first two.
"FNSOutput":
  text: Chooses the bitmap object that `FNSPrint` and `FNSShadowPrint` print into. With `clip_update` On, the clipping zone is also set to the whole bitmap, as by `FNSClipOutput`.
  notes: |
    Until it has been used, the prints do nothing. The bitmap may have up
    to 8 bitplanes.
"FNSInk":
  text: Sets the colour, 0 to 255, of the prints that do not give one.
"FNSPrefs":
  text: Sets the style of the prints that do not give one, and optionally their colour. The style bits are 1 centred, 2 bold, 4 underlined and 8 right-aligned.
"FNSHeight":
  text: The height in pixels of the font in slot `fontnum`, or -1 if the slot holds no font.
"FNSClip":
  text: Sets the clipping zone, the rectangle of the bitmap that prints may draw in. The x values are rounded down to multiples of 16; `xmax` is the first column not drawn in and `ymax` the first row not drawn in, so `FNSClip 0,0,320,256` is the whole of a 320 x 256 bitmap.
  notes: |
    With runtime error checking, an `xmin` or `ymin` below 0 is the error
    "FNSClip zone must not start below 0".
"FNSClipOutput":
  text: Sets the clipping zone to the whole bitmap chosen with `FNSOutput`.
"RemoveFNS":
  text: Empties font slot `fontnum`. The font's memory is not freed.
"FNSUnderline":
  text: The distance in pixels from the top of the font in slot `fontnum` to its underline, or -1 if the slot holds no font.
"FNSLength":
  text: The width in pixels of `a$` printed in the font of slot `fontnum`, with the style `prefs` (bold adds one pixel per character), or -1 if the slot holds no font. Without `prefs`, the style set with `FNSPrefs` counts.
  notes: |
    Only the low 4 bits of `fontnum` count, as with the other commands.
    The result is the width `FNSPrint` gives the text, the sum of the
    widths of its characters.
"FNSVersion":
  text: The version of the library as a quick value, 1.1.
"FNSOrigin":
  text: Sets an origin that is added to the position of every print; without parameters the origin goes back to 0,0.
  notes: |
    The clipping zone is not moved with it.
"FNSWidth":
  text: The width in pixels of the characters of the font in slot `fontnum` - 16, 32, 48 or 64 - or -1 if the slot holds no font.
"FNSLoad":
  text: Loads a font file into slot `fontslot` and returns the slot number, or -1 if the file could not be loaded.
  notes: |
    Amiga mode only. The file name is a long, the address of a name that
    ends in a zero byte, for example `&f$`. A file that is no FNS font,
    or one of height 0, is refused. The number of glyphs is taken from
    the size of the file.

    The file is loaded into a memory bank of the RI Amos Func library,
    which must be present as well: into bank 55 plus the slot number if
    the program has raised the number of banks with `BankLimit` so that
    this bank exists, otherwise into the highest free bank below the
    limit (50 banks at first). Erasing the bank, for example with
    `EraseAll`, removes the font.
"FNSSlot":
  text: The address of the 16 font slots, one long each that holds the address of the font in that slot or 0.
"FNSUnload":
  text: Empties a slot filled by `FNSLoad` and frees the bank the font was loaded into.
"FNSSetTab":
  text: Sets the distance in pixels between tab positions, which is 32 at first.
  notes: |
    With runtime error checking, a size below 1 is the error "FNSSetTab
    size must be at least 1"; without it, a tab character after
    `FNSSetTab 0` divides by zero.
"FNSShadowPrint":
  text: Prints a text like `FNSPrint`, but first once more one pixel to the right and below in the colour `shadow` (0 without it), which gives a shadow.
