"OpenCD":
  text: Opens unit 0 of cd.device, or the unit `unit` of the device `devicename`, for the other commands. As a function it returns -1 if the device was opened, else 0.
  notes: |
    Each `OpenCD` uses only what it is given: without arguments it opens
    unit 0 of cd.device, and the SCSI flag counts only for the call it is
    given to. A device name must be shorter than 40 characters; a longer
    one is refused with 0. Only one device can be open: call `CloseCD`
    before opening another. With runtime error checking, `OpenCD` while
    a device is open is a runtime error.

    With a `scsiflag` other than 0, `CDPlayTrack`, `CDReadTOC` and the
    track functions use SCSI commands, for a CD drive that does not
    understand cd.device's commands. The other commands send cd.device's
    commands also then, so `CDStop` does not stop a play started with
    SCSI.
"CloseCD":
  text: Stops playing and closes the device. Returns -1 if a device was open, else 0.
"CDDoor":
  text: Opens the tray of the drive with 1 and closes it with 0.
"CDPlayTrack":
  text: Starts playing `numtracks` tracks from the track `track#` on and returns at once, while the music plays. As a function it returns -1 if the play was sent, else 0.
  notes: |
    Tracks are numbered from 1. A play still running from the last
    `CDPlayTrack` is stopped first. With the SCSI flag of `OpenCD` the
    tracks are found in the table of contents of `CDReadTOC`, which must
    come first; the result is -1 if the drive took the command, and 0
    without a table of contents, for a track it does not hold and for 0
    tracks.
"CDReadTOC":
  text: Reads the table of contents of the CD, which `CDNumTracks`, `CDFirstTrack`, `CDLastTrack` and `CDTrackLength` use. Returns -1 if it worked, else 0.
  notes: |
    If reading fails, the library keeps no table of contents, and the
    track functions return 0.
"CDStatus":
  text: The status of the drive, a set of bits.
  notes: |
    | Bit value | Meaning |
    |---|---|
    | 1 | tray closed |
    | 2 | a disc is in |
    | 4 | the disc spins |
    | 8 | table of contents read |
    | 16 | track 1 holds data |
    | 32 | playing |
    | 64 | paused |
    | 128 | searching |
    | 256 | searching backwards |

    Several bits can be set at once; test one with `AND`, for example
    `If CDStatus AND 32`.
"CDStop":
  text: Stops the music that `CDPlayTrack` started and waits until the device has stopped it.
"CDVolume":
  text: Fades the volume to `volume`, 0 to 32767, over `lengthoffade` frames of 1/75 second, through the device's CD_ATTENUATE command, and returns the device's error code.
"CDNumTracks":
  text: The number of tracks on the CD, from the table of contents read with `CDReadTOC`; 0 before it.
"CDFirstTrack":
  text: The number of the first track on the CD, from the table of contents read with `CDReadTOC`; 0 before it.
"CDLastTrack":
  text: The number of the last track on the CD, from the table of contents read with `CDReadTOC`; 0 before it.
"CDTrackLength":
  text: The length of a track in seconds, from its start to the start of the next track or, for the last track, to the end of the CD's music. It is 0 before `CDReadTOC`.
  notes: |
    The track must exist on the CD: check it against `CDFirstTrack` and
    `CDLastTrack`. With runtime error checking, another track is a
    runtime error; without it, the result means nothing.
"CDUpdateInfo":
  text: Asks the drive for the track playing and its position, for `CDTrackPlaying`, `CDTrackMins` and `CDTrackSecs`. The result is the address of that information, 0 without an open device.
"CDFlush":
  text: Sends the device's flush command (CD_FLUSH).
"CDPause":
  text: Pauses the music with 1 (or -1) and goes on with 0.
  notes: |
    Only the lowest bit of the value counts, so 2 also goes on.
"CDRewind":
  text: Makes the drive search backwards through the music.
"CDFastForward":
  text: Makes the drive search forwards through the music. Returns the device's error code.
"CDNormalSpeed":
  text: Ends `CDRewind` or `CDFastForward` and plays at normal speed again.
"CDSpeed":
  text: Sets the search mode directly - 0 normal play, 1 forwards, 2 backwards.
"CDTrackMins":
  text: The minutes of the position found by the last `CDUpdateInfo` - from the start of the track, or with an `offset` of 1 from the start of the CD.
  notes: |
    With runtime error checking, an offset other than 0 or 1 is a runtime
    error; without it, the result means nothing.
"CDTrackSecs":
  text: The seconds of the position found by the last `CDUpdateInfo` - from the start of the track, or with an `offset` of 1 from the start of the CD.
  notes: |
    With runtime error checking, an offset other than 0 or 1 is a runtime
    error; without it, the result means nothing.
"CDTrackPlaying":
  text: The number of the track that was playing at the last `CDUpdateInfo`.
"CDMotor":
  text: Switches the motor of the drive on with 1 (or -1) and off with 0.
  notes: |
    Only the lowest bit of the value counts, so 2 switches it off.
