"CludgeSound":
  text: Makes sound object `sound#` from the IFF 8SVX file at `address` in memory, copying its sample into chip memory. As a function it returns -1 on success, and 0 if the file cannot be used (see below); without enough chip memory the program stops with the runtime error "Out of Memory!".
  notes: |
    The result is 0 if the file is no 8SVX file with a header chunk,
    has a sample rate of 0, has no sample data among its first seven
    chunks (the header chunk included), or has an empty sample or one of
    131072 bytes or more. The search for the sample data expects the pad
    byte that IFF puts behind a chunk of odd length, and ends at the end
    of the file's FORM.

    The sound object's old sample is freed only when the file has passed
    these checks, so a call that fails leaves the sound as it was. The
    old sample is not freed when it is data in chip memory that
    `DecodeSound` uses where it is. The playback rate comes from the
    file's header; the sound has no loop.
