"CreateThread":
  text: Starts the code at `address` (a label given with `?label`, ending with `RTS`) as a new DOS process called `name`, which runs alongside the program.
  notes: |
    Amiga mode only. The command returns at once, before the thread has
    started to run. The thread shares the program's global variables and
    gets 10 KB of cleared working memory of its own. Each thread runs its
    own code with its own memory, also when several `CreateThread` follow
    each other before the first thread has begun to run. A thread that cannot be started, for lack of memory, is not counted.
"ActiveThreads":
  text: The number of threads started with `CreateThread` that have not ended yet.
  notes: |
    Amiga mode only.

    When the program ends, it waits until no thread runs any more.
