"DataTypeOpen":
  text: Opens a file and finds the datatype that matches it. Returns a value other than 0 on success, and 0 if the file cannot be found, no datatype matches it, another file is still open or datatypes.library could not be opened.
"DataTypeClose":
  text: Frees the datatype object and closes the file opened with `DataTypeOpen`. An object that is still attached to a window is removed from it first.
"DataTypeName":
  text: The name of the datatype of the open file, for example `ILBM`. An empty string if no file is open.
"DataTypeBaseName":
  text: The base name of the datatype of the open file, the name of the datatype's own library without `.datatype`, for example `ilbm`. An empty string if no file is open.
"DataTypeID":
  text: The ID of the datatype of the open file, up to four characters, for example `ILBM`; for an IFF file the FORM type. An empty string if no file is open.
"DataTypeCreate":
  text: Loads the open file into a datatype object, for the commands that work on the object. Returns the object's address, or 0 if it cannot be made. The optional tag list is passed to the system when the object is made.
  notes: |
    The command returns 0 when no file is open, and while an object
    exists: the object stays in use until `DataTypeClose`.
"AttachDataType":
  text: Adds the datatype object to a window as a gadget with the ID `id`, at 0,0 in the size of the picture, at `x`,`y` in the size `width`,`height`, or with a tag list. Returns -1, or 0 if there is no object or an object is attached already.
  notes: |
    The object sends its update messages to the window as
    `IDCMP_IDCMPUPDATE` events; it is not ready to be drawn until
    `DataTypeReady` returns -1. The colours of a picture are not
    remapped. Only one object can be attached at a time.

    The form without a position reads the picture's bitmap header itself
    if `DataTypeBitmap` was not called, so `DataTypeWidth` and the other
    size functions can use it afterwards; for an object that is not a
    picture, this form returns 0. The form with a tag list passes the
    tag list on to the object.
"DetachDataType":
  text: Removes the datatype object from the window it was attached to with `AttachDataType`. Nothing happens if it is not attached.
"DataTypeSuper":
  text: The name of the class of the datatype object, for example `ilbm.datatype`. An empty string if there is no object.
"DataTypeBitmap":
  text: Reads the bitmap header of a picture object, which holds the picture's size and depth, and returns its address; 0 if there is no object or it is not a picture. Call it before `DataTypeWidth`, `DataTypeHeight`, `DataTypeDepth` and `DataTypeModeID`.
"DataTypesPalette":
  text: Copies the colours of the picture object into the palette object `palette#`, at most as many as the palette object has. Returns a value other than 0 after copying, and 0 if there is no object or it has no colours.
  notes: |
    The palette object must already exist; give it as many colours as
    the picture has, 2 to the power of `DataTypeDepth`. A smaller
    palette gets the picture's first colours, a larger one keeps its
    other colours. The object does not have to be attached to a window.
"DataTypeWidth":
  text: The width of the picture in pixels, from the bitmap header that `DataTypeBitmap` reads; 0 if it has not been read.
"DataTypeHeight":
  text: The height of the picture in pixels, from the bitmap header that `DataTypeBitmap` reads; 0 if it has not been read.
"DataTypeDepth":
  text: The depth of the picture in bitplanes, from the bitmap header that `DataTypeBitmap` reads; 0 if it has not been read.
"DataTypeReady":
  text: Returns -1 when the system has finished preparing the attached object and it can be drawn, and 0 while it is still working or when no object is attached.
"SetDataTypeAttr":
  text: Changes attributes of the datatype object, given as the address of a tag list or as pairs of attribute and value. Nothing happens if there is no object.
"GetDataTypeAttr":
  text: Reads one attribute of the datatype object and returns the address where its value is stored, not the value itself; read it with `Peek.l`. Returns 0 if there is no object.
  notes: |
    The value is kept in a buffer that the next command of the library
    may overwrite.
"DataTypeModeID":
  text: The display mode ID that suits the size and depth of the picture best, for example to open a screen for it; 0 if the bitmap header of `DataTypeBitmap` has not been read.
  notes: |
    The form with a tag list passes the program's tags on to the system
    after the library's own three, the picture's width, height and
    depth; for a tag in both, the library's value counts. The program's
    list stays unchanged.
"DataTypeGroup":
  text: The group of the datatype of the open file, four characters, for example `pict` for pictures. An empty string if no file is open.
  notes: |
    The groups of the system are `pict` (picture), `anim` (animation),
    `movi` (movie), `text` (text), `docu` (hypertext document), `musi`
    (music), `soun` (sound), `inst` (musical instrument) and `syst`
    (system file).
