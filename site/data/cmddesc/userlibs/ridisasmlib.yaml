"DisAssemble$":
  text: The instruction at `address` as a line of assembler text, at least 34 characters long; `?????` for an instruction the library does not know.
  notes: |
    A shorter line is padded with spaces to 34 characters; a longer one,
    such as a 68020 instruction with two memory indirect operands, comes
    back whole.

    On a 68000 the address must be even, as the code is read in words.
"InstrSize":
  text: The size in bytes of the instruction last disassembled with `DisAssemble$`; 2 for an unknown one, 0 before the first call.
