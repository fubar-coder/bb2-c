"CludgeSound":
  text: Makes sound object `sound#` from the IFF 8SVX file at `address` in memory, copying its sample into chip memory. As a function it returns -1 on success, and 0 if the file cannot be used; without enough chip memory the program stops with the runtime error "Out of Memory!".
  notes: |
    The same command as in the first sound library (see there for the
    files it refuses): a call that fails leaves the sound as it was, the
    rate comes from the file's header, and the search for the sample data
    expects the pad byte behind a chunk of odd length.

    `PlaySoundAHI` plays a sound made with it, like any other sound
    object, at the pitch of its period.
"OpenAHI":
  text: Opens unit `unit` of ahi.device, version 4 or newer. As a function it returns -1 on success, and 0 if the device cannot be opened or is already open.
  notes: |
    Amiga mode only. `deviceID` is stored but not used. After `CloseAHI`
    the device can be opened again. On Kickstart 1.x, where AHI does not
    run, the result is always 0.
"CloseAHI":
  text: Stops a sound that `PlaySoundAHI` still plays and closes ahi.device. The library does the same when the program ends.
  notes: |
    Amiga mode only. The library's I/O request and message port stay for
    the next `OpenAHI`; they are freed when the program ends.
"PlaySoundAHI":
  text: Plays sound object `sound` through AHI, at `volume` (default 1, full) and `balance` (default 0.5, the middle), and returns at once while it plays.
  notes: |
    The sound plays at the pitch of its period, the pitch `Sound` plays
    it at, and with its whole sample. A sound that still plays from the
    last `PlaySoundAHI` is stopped first. Nothing happens before
    `OpenAHI`.
"PlayRawAHI":
  text: Plays `length` bytes of an 8 bit mono sample at `address` through AHI at `frequency` Hz, with `volume` (default 1, full) and `balance` (default 0.5, the middle).
  notes: |
    The command returns when the sample has been played, so the data may
    be freed or changed afterwards. A sound that still plays from
    `PlaySoundAHI` is stopped first. Nothing happens before `OpenAHI`.
"AHIOutputRequest":
  text: Shows AHI's requester for choosing an audio mode. Returns nonzero if the user chose a mode, and 0 if the user cancelled, the requester could not be made or `OpenAHI` was not called.
  notes: |
    Amiga mode only. The arguments are the requester's position and size,
    and the audio mode and mixing frequency it starts with. The form with
    1 argument takes the mode, the one with 2 the mode and the frequency,
    the one with 4 the position and size; the values left out are -1 for
    the position and size and 0 for the mode and frequency. The requester
    opens on the screen the program uses. `AHIRequestedID` and
    `AHIRequestedFreq` return the choice.
"AHIRequestedID":
  text: The audio mode the user chose in the last `AHIOutputRequest` that was confirmed. It is -1 before a choice, and 0 if `OpenAHI` was not called.
"AHIRequestedFreq":
  text: The mixing frequency the user chose in the last `AHIOutputRequest` that was confirmed. It is 0 before a choice, and if `OpenAHI` was not called.
