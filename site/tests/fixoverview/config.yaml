# Added to hugo.yaml by the test of the fix overview's check
# (site/tests/CMakeLists.txt): the broken data files in data/ here are
# under the key fixtests of hugo.Data, and the environment variable
# HUGO_PARAMS_FIXOVERVIEWDATA picks one, as fixtests.missing-anchor.
module:
  mounts:
    - source: data
      target: data
    - source: tests/fixoverview/data
      target: data/fixtests
