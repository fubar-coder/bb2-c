name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'Doxyfile'
      - 'libs/include/**'
      - 'libs/deflibs/deflib.h'
      - 'libs/acidlibs/**'
      - 'libs/userlibs/rwe/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  api:
    # The API reference (Doxyfile) in Doxygen's official image, pinned by
    # tag; warnings fail the run. On the runner, not in a container job: the
    # image's entry point is doxygen itself.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Doxygen
        run: |
          mkdir -p site/static/api
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src \
            ghcr.io/doxygen/doxygen:Release_1_18_0 Doxyfile

      - name: Upload the API reference
        uses: actions/upload-artifact@v7
        with:
          name: api
          path: site/static/api
          if-no-files-found: error

  build:
    needs: api
    runs-on: ubuntu-latest
    # Same image as the local preview (site/README.md); the tag pins Hugo.
    container: hugomods/hugo:exts-0.154.5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # enableGitInfo needs the full history

      - name: Trust the workspace
        # The container user differs from the owner of the checkout.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Put the API reference in place
        uses: actions/download-artifact@v8
        with:
          name: api
          path: site/static/api

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: hugo --gc --minify --source site --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Install GNU tar
        # The image's BusyBox tar lacks the options upload-pages-artifact uses.
        run: apk add --no-cache tar

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
