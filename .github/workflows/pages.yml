name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Same image as the local preview (site/README.md); the tag pins Hugo.
    container: hugomods/hugo:exts-0.154.5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # enableGitInfo needs the full history

      - name: Trust the workspace
        # The container user differs from the owner of the checkout.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: hugo --gc --minify --source site --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
