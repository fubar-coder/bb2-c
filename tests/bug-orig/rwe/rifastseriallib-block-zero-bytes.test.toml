# rifastseriallib-block-zero-bytes.test.bas: with the serial port of the
# emulator; the original sends 2^32 bytes and does not come back (the session
# of its own ends in the time limit)
fixed-orig = 646
rwe = ["rifastseriallib"]
serial = "on"
timeout = 30
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
