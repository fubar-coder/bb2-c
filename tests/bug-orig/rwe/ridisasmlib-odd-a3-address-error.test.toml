# ridisasmlib-odd-a3-address-error.test.bas: on the A500 (68000) the original
# crashes with an address error ("Software error - task held" on Kickstart
# 1.3, the session ends in a timeout)
fixed-orig = 617
rwe = ["ridisasmlib"]
machine = "a500"
timeout = 30
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"
