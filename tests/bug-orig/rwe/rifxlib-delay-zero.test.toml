# rifxlib-delay-zero.test.bas: with runtime error checking for the
# announced error; the original hangs in the delay of 0
fixed-orig = 669
rwe = ["rifxlib"]
runtime-errors = "on"
# the original hangs: a session of its own for its cell
isolate = ["compiler=orig210"]

[asserts]
"check.delay_zero.not_refused" = "== not-run"

[deviations."compiler=orig210"]
"check.delay_zero.refused" = "== fail"
session = "== timeout"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
