# riamosfunclib-v36-doslist.test.bas: on the a500 (Kickstart 1.3, dos V34)
# the original crashes at the first FindVolume
fixed-orig = 1145
rwe = ["riamosfunclib"]
timeout = 30

[matrix]
machine = ["a500", "a500-204", "a1200"]

[deviations."compiler=orig210,machine=a500"]
session = "== timeout"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
requester = "contains \"Software error - task held\""

# from Kickstart 2.04 on the original works but returns the address of the
# DosList entry for a volume that is present (#1082)
[deviations."compiler=orig210,machine=a500-204"]
"check.v36_doslist.ram" = "== fail"
"check.v36_doslist.ram_lower" = "== fail"
"check.v36_doslist.sys" = "== fail"

[deviations."compiler=orig210,machine=a1200"]
"check.v36_doslist.ram" = "== fail"
"check.v36_doslist.ram_lower" = "== fail"
"check.v36_doslist.sys" = "== fail"
