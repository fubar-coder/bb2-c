# riamosfunclib-count-zero.test.bas: the original's CopyByte with the count 0
# copies 2^32 bytes; the CPU runs at real speed so that the copy cannot
# reach the end of the address space within the limit, and the original
# never comes back (a session of its own: the hang ends it)
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 492
rwe = ["riamosfunclib"]
uae = ["cpu_speed=real", "cachesize=0"]
timeout = 120
isolate = ["compiler=orig210"]

[ends."compiler=orig210"]
reason = "the original's faulty part corrupts memory (#492): its end is not defined, it may crash, hang or halt"
abnormal = ["any"]
