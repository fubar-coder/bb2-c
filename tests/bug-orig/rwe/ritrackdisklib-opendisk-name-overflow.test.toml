# ritrackdisklib-opendisk-name-overflow.test.bas: the original halts the CPU
# when finit closes the unit with the overwritten request pointer: the 61
# character name puts "xxx",0 (address $78787800, nothing there) into the
# pointer of unit 0, and DoIO on it halts the CPU after the end of the run
fixed-orig = 860
rwe = ["ritrackdisklib"]

[deviations."compiler=orig210"]
session = "== halt"
rc = "not exists"
