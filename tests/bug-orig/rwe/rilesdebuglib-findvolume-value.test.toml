# rilesdebuglib-findvolume-value.test.bas: on the a500 (Kickstart 1.3) and
# the a1200; the original returns the address of the DOS list entry on the
# a1200, and crashes at D_FindVolume on the a500 (#1148, dos V34)
fixed-orig = 1167
rwe = ["rilesdebuglib"]
# the crash ends the session: the original's cells have one of their own
isolate = ["compiler=orig210"]

[matrix]
machine = ["a500", "a1200"]

[deviations."compiler=orig210,machine=a1200"]
"check.volumes.found" = "== fail"

[deviations."compiler=orig210,machine=a500"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"
