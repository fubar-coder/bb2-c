# riseriallib-readstring-open.test.bas: with the serial port of the emulator;
# the original returns to the address the program put in d0 (rec); its RTS
# hangs, the session of its own ends in the time limit
fixed-orig = 796
rwe = ["riseriallib"]
serial = "on"
timeout = 30
isolate = ["compiler=orig210"]

[ends."compiler=orig210"]
reason = "the original returns to d0 instead of its return address (#796): the program runs rec, whose RTS hangs (the check behind the call is not run); what it runs next follows the stack the library left and the layout of the test program (driver, testlib), so the same return seen as a normal end without the string is declared too"
hangs = ["session == timeout", "rc not exists", "end.case not exists", "end.run not exists", "check.readstring_open.string == not-run"]
wrong_return = ["session == done", "rc == 0", "end.case exists", "end.run exists", "check.readstring_open.return_address == fail", "check.readstring_open.string == fail"]
