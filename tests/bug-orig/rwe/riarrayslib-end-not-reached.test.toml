# riarrayslib-end-not-reached.test.bas: the reference library's FillArray runs
# on through all memory (the session ends)
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 882
rwe = ["riarrayslib"]
timeout = 30

[ends."compiler=orig210"]
reason = "the original's faulty part corrupts memory (#882): its end is not defined, it may crash, hang or halt"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists", "check.empty_array.fill_returned != ok", "check.empty_array.first_element != ok"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists", "check.empty_array.fill_returned != ok", "check.empty_array.first_element != ok"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists", "check.empty_array.fill_returned != ok", "check.empty_array.first_element != ok"]
abnormal_run_only = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run exists", "check.empty_array.fill_returned != ok", "check.empty_array.first_element != ok"]
