# riarrayslib-end-not-reached.test.bas: the reference library's FillArray runs
# on through all memory (the session ends)
fixed-orig = 882
rwe = ["riarrayslib"]
timeout = 30

[deviations."compiler=orig210"]
session = "== halt"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
"check.empty_array.fill_returned" = "== not-run"
"check.empty_array.first_element" = "== not-run"
