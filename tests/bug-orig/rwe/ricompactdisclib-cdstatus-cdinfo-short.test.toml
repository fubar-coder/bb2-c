# ricompactdisclib-cdstatus-cdinfo-short.test.bas: the A1200 with
# uaescsi.device and the library's CD image; the original's CDStatus writes
# 8 bytes behind the library and the unloading of the program stops with the
# alert 8100 0005 (the session ends in a timeout)
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 948
rwe = ["ricompactdisclib"]
timeout = 30
uae = ["scsi=true", "cdimage0=@TESTDATA@/ricompactdisclib.cue,image"]
# the crash ends the session: the original's cell has one of its own
isolate = ["compiler=orig210"]

[ends."compiler=orig210"]
reason = "the original's faulty part corrupts memory (#948): its end is not defined, it may crash, hang or halt"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists"]
abnormal_run_only = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run exists"]
