# rievallib-indirect-register-stale-d1.test.bas: the original's check of the
# closing bracket fails with error 5; the cells with the CD's libraries get
# the acidlibs of the library's variant (library 121 is the CD's polylib)
fixed-orig = 637
rwe = ["rievallib"]
files = ["blitz2/acidlibs|@TESTDATA@/../../../variants/rwe-1999-eval/acidlibs|libs=cd"]

[deviations."compiler=orig210"]
"check.register_indirect.indirect_result" = "== fail"
"check.register_indirect.indirect_result.actual" = "== 0"
"check.register_indirect.indirect_error" = "== fail"
"check.register_indirect.indirect_error.actual" = "== 5"
"check.register_indirect.sum_result" = "== fail"
"check.register_indirect.sum_result.actual" = "== 0"
"check.register_indirect.sum_error" = "== fail"
"check.register_indirect.sum_error.actual" = "== 5"
