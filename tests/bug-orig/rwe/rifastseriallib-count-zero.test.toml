# rifastseriallib-count-zero.test.bas: with the serial port of the emulator,
# which sends nothing; the original waits for the first of 65536 bytes (the
# session of its own ends in the time limit)
fixed-orig = 1164
rwe = ["rifastseriallib"]
serial = "on"
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
