# rifastseriallib-divul-68000.test.bas: on the A600 (68000) the original's
# DIVU.L is an illegal instruction; its session of its own ends in the time
# limit
fixed-orig = 647
rwe = ["rifastseriallib"]
machine = "a600"
timeout = 30
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software Failure\""
"end.case" = "not exists"
"end.run" = "not exists"
