# ritrackdisklib-disk-formattrack.test.bas: a blank image in DF1 on the three
# machines; the original sends TD_FORMAT with a length trackdisk.device
# refuses
fixed-orig = 858
rwe = ["ritrackdisklib"]
floppy = ["1|@TESTDATA@/ritrackdisklib-blank.adf"]
timeout = 60
# the cells share a session per machine and trackdisk.device keeps the tracks
# the port's cell wrote in its buffer: the original's cells have their own
isolate = ["compiler=orig210"]

[matrix]
machine = ["a500", "a500-204", "a1200"]

[deviations."compiler=orig210,machine=a500-204"]
"check.format_tracks.formattrack_no_count" = "== fail"
"check.format_tracks.formattrack_no_count.actual" = "== 252"
"check.format_tracks.writeboot" = "== fail"
"check.format_tracks.writeboot.actual" = "== 252"
"check.format_tracks.sector_0" = "== fail"
"check.format_tracks.sector_0.actual" = "== \"SECTOR 0000\""
"check.format_tracks.sector_11" = "== fail"
"check.format_tracks.sector_11.actual" = "== \"SECTOR 0011\""
"check.format_tracks.sector_21" = "== fail"
"check.format_tracks.sector_21.actual" = "== \"\""

[deviations."compiler=orig210,machine=a1200"]
"check.format_tracks.formattrack_no_count" = "== fail"
"check.format_tracks.formattrack_no_count.actual" = "== 252"
"check.format_tracks.writeboot" = "== fail"
"check.format_tracks.writeboot.actual" = "== 252"
"check.format_tracks.sector_0" = "== fail"
"check.format_tracks.sector_0.actual" = "== \"SECTOR 0000\""
"check.format_tracks.sector_11" = "== fail"
"check.format_tracks.sector_11.actual" = "== \"SECTOR 0011\""
"check.format_tracks.sector_21" = "== fail"
"check.format_tracks.sector_21.actual" = "== \"\""

# on Kickstart 1.3 the original crashes at the start (#941)
[deviations."compiler=orig210,machine=a500"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"
