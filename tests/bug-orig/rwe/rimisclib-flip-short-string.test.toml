# rimisclib-flip-short-string.test.bas: the reference library reverses 128 KB
# around the string; with the string 70000 bytes inside a string buffer of
# 600000 the writes stay in the buffer and the checks of the two short
# strings fail
fixed-orig = 751
rwe = ["rimisclib"]
jobline = ["strbuf=600000"]
# the original's cell has a session of its own
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
"check.short_strings.flip_empty" = "== fail"
"check.short_strings.flip_one" = "== fail"
