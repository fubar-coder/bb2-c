# rimisclib-workbenchhere-partial-at-title-end.test.bas: the reference library
# loops for ever (the session runs into its timeout)
fixed-orig = 762
rwe = ["rimisclib"]
# the hang ends the session: the original's cell has one of its own
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
