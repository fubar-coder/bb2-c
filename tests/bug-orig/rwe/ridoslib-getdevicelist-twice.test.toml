# ridoslib-getdevicelist-twice.test.bas: through inject, whose doslist locks
# the DOS list for writing after the program; the original leaves it locked
# for reading
fixed-orig = 1081
rwe = ["ridoslib"]
runwrap = "@INJECT@|doslist"

[asserts]
inject = "contains \"doslist: free\""

[deviations."compiler=orig210"]
inject = "contains \"doslist: locked (1 read locks released)\""
