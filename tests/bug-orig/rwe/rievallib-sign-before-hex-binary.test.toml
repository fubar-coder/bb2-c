# rievallib-sign-before-hex-binary.test.bas: the original reads the digits
# behind the sign as decimal; the cells with the CD's libraries get the
# acidlibs of the library's variant (library 121 is the CD's polylib)
fixed-orig = 643
rwe = ["rievallib"]
files = ["blitz2/acidlibs|@TESTDATA@/../../../variants/rwe-1999-eval/acidlibs|libs=cd"]

[deviations."compiler=orig210"]
"check.signed_numbers.negative_hex" = "== fail"
"check.signed_numbers.negative_hex.actual" = "== -24410"
"check.signed_numbers.negative_binary" = "== fail"
"check.signed_numbers.negative_binary.actual" = "== -2451"
