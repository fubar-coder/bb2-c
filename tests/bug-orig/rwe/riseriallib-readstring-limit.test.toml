# riseriallib-readstring-limit.test.bas: with the serial port of the emulator
# and a string work area of 1000 bytes; the original stores the 1050 bytes
# (50 behind the area) and waits for the 0 that never comes: a hang that
# the session of its own ends in the time limit.  The wait is in the loop
# of the library itself, whose return would be wrong anyway (#796), so a
# clean end is not possible; the 1050 bytes keep the write 50 bytes behind
# the area
fixed-orig = 1161
rwe = ["riseriallib"]
serial = "on"
jobline = ["strbuf=1000"]
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
