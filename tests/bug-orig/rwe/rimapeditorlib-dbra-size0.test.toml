# announced error; the original raises none and overwrites the marker
fixed-orig = 895
rwe = ["rimapeditorlib"]
runtime-errors = "on"

[asserts]
"check.fill_width_8.not_refused" = "== not-run"
"check.fill_width_8.marker_kept" = "== not-run"

