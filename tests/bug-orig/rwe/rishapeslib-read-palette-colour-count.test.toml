# rishapeslib-read-palette-colour-count.test.bas: through inject the guard
# pattern behind every allocation is checked; the original writes 768 KB
# behind an allocation
fixed-orig = 820
rwe = ["rishapeslib", "ripacklib", "riamosfunclib"]
files = ["s.le|@TESTDATA@/rishapeslib-read-palette-colour-count.le"]
runwrap = "@INJECT@|guard"
isolate = ["compiler=orig210"]

[ends."compiler=orig210"]
reason = "the 768 KB wild write lands in memory whose use differs with the layout (#820): the program usually survives it and inject reports the pattern behind the allocation, but the session can also end as a CPU halt"
returns = ["session == done", "rc == 0", "end.case exists", "end.run exists", "output contains \"inject: guard: written behind an allocation\""]
halts = ["session == halt", "rc not exists", "end.case not exists", "end.run not exists"]

[asserts]
output = "not contains \"inject: guard\""
