# rishapeslib-read-palette-colour-count.test.bas: through inject the guard
# pattern behind every allocation is checked; the original writes 768 KB
# behind an allocation
fixed-orig = 820
rwe = ["rishapeslib", "ripacklib", "riamosfunclib"]
files = ["s.le|@TESTDATA@/rishapeslib-read-palette-colour-count.le"]
