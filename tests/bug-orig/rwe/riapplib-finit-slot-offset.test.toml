# riapplib-finit-slot-offset.test.bas: on the A600 (68000) the reference
# library's finit makes an address error at the program's end: the case
# ends, the run does not
fixed-orig = 524
rwe = ["riapplib"]
machine = "a600"
timeout = 30

[deviations."compiler=orig210"]
session = "== timeout"
requester = "contains \"Software Failure\""
"end.run" = "not exists"
rc = "not exists"
