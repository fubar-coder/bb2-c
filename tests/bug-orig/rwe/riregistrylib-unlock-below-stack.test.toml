# riregistrylib-unlock-below-stack.test.bas: the reference library pops below
# its structure stack and calls registry.library through a base of 0: the CPU
# halts.  The entry in front of the stack is the end of the library file's
# token table (tests/README.md "The original's end follows the link layout"),
# so the third UnlockRegistry calls through the base 0 and the CPU halts, the
# same on every run (5 of 5)
fixed-orig = 781
rwe = ["riregistrylib"]
# the halt ends the session: the original's cell has one of its own
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== halt"
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
