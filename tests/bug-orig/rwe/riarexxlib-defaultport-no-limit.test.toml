# riarexxlib-defaultport-no-limit.test.bas: the reference library overwrites
# rexxbase with an address the program built; the next message jumps to rec
# (the check "library_base" fails with 1, "received" is not run)
fixed-orig = 529
rwe = ["riarexxlib"]

[deviations."compiler=orig210"]
"check.long_name.library_base" = "== fail"
"check.long_name.library_base.actual" = "== 1"
"check.long_name.received" = "== not-run"
