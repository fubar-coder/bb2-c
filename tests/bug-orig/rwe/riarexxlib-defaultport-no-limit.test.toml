# riarexxlib-defaultport-no-limit.test.bas: the reference library overwrites
# rexxbase; the next message crashes (the session halts)
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 529
rwe = ["riarexxlib"]
timeout = 30

[ends."compiler=orig210"]
reason = "the original's faulty part corrupts memory (#529): its end is not defined, it may crash, hang or halt"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists", "check.long_name.received != ok"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists", "check.long_name.received != ok"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists", "check.long_name.received != ok"]
abnormal_run_only = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run exists", "check.long_name.received != ok"]
