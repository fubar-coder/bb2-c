# popupwinlib-v36-menu.test.bas: on the a500 (Kickstart 1.3), the a500-204
# (Kickstart 2.04) and the a1200; the original crashes at the start of the
# program on the a500
fixed-orig = 1140
rwe = ["popupwinlib"]
# the crash ends the session: the original's cells have one of their own
isolate = ["compiler=orig210"]

[matrix]
machine = ["a500", "a500-204", "a1200"]

[deviations."compiler=orig210,machine=a500"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"
