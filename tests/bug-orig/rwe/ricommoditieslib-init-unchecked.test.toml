# ricommoditieslib-init-unchecked.test.bas: the program runs through inject with
# the open of commodities.library failing; the original jumps through the
# base 0 and the CPU halts
fixed-orig = 559
rwe = ["ricommoditieslib"]
timeout = 30
runwrap = "@INJECT@|openlibfail=commodities.library"
# the crash ends the session: the original's cell has one of its own
isolate = ["compiler=orig210"]

[asserts]
inject = "contains \"inject: openlibfail:\""

[deviations."compiler=orig210"]
session = "== halt"
inject = "not exists"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
