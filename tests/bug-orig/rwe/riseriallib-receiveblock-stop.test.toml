# riseriallib-receiveblock-stop.test.bas: with the serial port of the
# emulator; the original returns to the long above its return address
fixed-orig = 803
rwe = ["riseriallib"]
serial = "on"
# what the original does behind the wrong return can end the session
isolate = ["compiler=orig210"]

[ends."compiler=orig210"]
reason = "SerialReceiveBlock returns to the long above its return address (#803); what the program does from there depends on what it finds, and so on the layout of the test program including testlib and the driver: measured: the program ends normally without the end of the case, the check behind the call is not run, and the end is the same on every run"
wrong_return = ["session == done", "rc == 0", "end.case not exists", "end.run exists", "check.receiveblock_stop.returned == not-run"]
