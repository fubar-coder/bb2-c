# ciatrklib-v36-calls.test.bas: on the a500 (Kickstart 1.3), the a500-204
# (Kickstart 2.04) and the a1200
fixed-orig = 1146
rwe = ["ciatrklib"]
timeout = 30
files = ["n.mod|@TESTDATA@/ciatrklib-free-while-playing.mod"]
# the crash ends the session: the original's cells have one of their own
isolate = ["compiler=orig210"]

[matrix]
machine = ["a500", "a500-204", "a1200"]

[deviations."compiler=orig210,machine=a500"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"

[deviations."compiler=orig210,machine=a500-204"]
rc = "not exists"
requester = "contains \"Software Failure\""
"end.case" = "not exists"
"end.run" = "not exists"
