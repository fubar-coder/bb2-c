# riseriallib-readlong.test.bas: with the serial port of the emulator; the
# original reads bytes without end (the session of its own ends in the time
# limit)
fixed-orig = 794
rwe = ["riseriallib"]
serial = "on"
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
