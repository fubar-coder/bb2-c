# rimisclib-v36-ezrequest.test.bas: Kickstart 1.3; the reference library
# crashes at the first requester ("Software error - task held")
fixed-orig = 1150
rwe = ["rimisclib"]
machine = "a500"
timeout = 30

[asserts]
requester = "count == 5"

[deviations."compiler=orig210"]
session = "== timeout"
requester = "contains \"Software error - task held\""
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
