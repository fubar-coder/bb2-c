# ritrackdisklib-disk-motor.test.bas: a blank image in DF1 on the three
# machines; the original's DiskMotor is -1 whatever the motor does
fixed-orig = 857
rwe = ["ritrackdisklib"]
floppy = ["1|@TESTDATA@/ritrackdisklib-blank.adf"]
timeout = 60
# the cells share a session per machine and trackdisk.device keeps the tracks
# the port's cell wrote in its buffer: the original's cells have their own
isolate = ["compiler=orig210"]

[matrix]
machine = ["a500", "a500-204", "a1200"]

[deviations."compiler=orig210,machine=a500-204"]
"check.motor_state.opened" = "== fail"
"check.motor_state.opened.actual" = "== -1"
"check.motor_state.after_motoroff" = "== fail"
"check.motor_state.after_motoroff.actual" = "== -1"
"check.motor_state.after_closedisk" = "== fail"
"check.motor_state.after_closedisk.actual" = "== -1"

[deviations."compiler=orig210,machine=a1200"]
"check.motor_state.opened" = "== fail"
"check.motor_state.opened.actual" = "== -1"
"check.motor_state.after_motoroff" = "== fail"
"check.motor_state.after_motoroff.actual" = "== -1"
"check.motor_state.after_closedisk" = "== fail"
"check.motor_state.after_closedisk.actual" = "== -1"

# on Kickstart 1.3 the original crashes at the start (#941)
[deviations."compiler=orig210,machine=a500"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"
