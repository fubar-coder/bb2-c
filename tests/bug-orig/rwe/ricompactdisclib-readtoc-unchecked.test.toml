# ricompactdisclib-readtoc-unchecked.test.bas: the A1200 with uaescsi.device and
# the library's CD image; the original's TOC functions read the TOC buffer
# that globalloc did not clear (the values are what the memory held)
fixed-orig = 581
rwe = ["ricompactdisclib"]
uae = ["scsi=true", "cdimage0=@TESTDATA@/ricompactdisclib.cue,image"]

[deviations."compiler=orig210"]
"check.no_answer.num_tracks" = "== fail"
"check.no_answer.first_track" = "== fail"
"check.no_answer.last_track" = "== fail"
