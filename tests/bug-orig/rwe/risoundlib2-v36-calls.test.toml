# risoundlib2-v36-calls.test.bas: Kickstart 1.3; the reference library
# crashes in its init, before the first line of the program ("Software error
# - task held"; the result file does not exist)
fixed-orig = 1139
rwe = ["risoundlib2"]
machine = "a500"
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
