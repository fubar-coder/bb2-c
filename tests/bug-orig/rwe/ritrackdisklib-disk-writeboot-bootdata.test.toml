# ritrackdisklib-disk-writeboot-bootdata.test.bas: a blank image in DF1 on the
# three machines; the original writes nothing
fixed-orig = 864
rwe = ["ritrackdisklib"]
floppy = ["1|@TESTDATA@/ritrackdisklib-blank.adf"]
timeout = 60
# the cells share a session per machine and trackdisk.device keeps the tracks
# the port's cell wrote in its buffer: the original's cells have their own
isolate = ["compiler=orig210"]

[matrix]
machine = ["a500", "a500-204", "a1200"]

[deviations."compiler=orig210,machine=a500-204"]
"check.bootdata.writeboot" = "== fail"
"check.bootdata.writeboot.actual" = "== 252"
"check.bootdata.sector_0" = "== fail"
"check.bootdata.sector_0.actual" = "== \"SECTOR 0000\""
"check.bootdata.sector_1" = "== fail"
"check.bootdata.sector_1.actual" = "== \"\""

[deviations."compiler=orig210,machine=a1200"]
"check.bootdata.writeboot" = "== fail"
"check.bootdata.writeboot.actual" = "== 252"
"check.bootdata.sector_0" = "== fail"
"check.bootdata.sector_0.actual" = "== \"SECTOR 0000\""
"check.bootdata.sector_1" = "== fail"
"check.bootdata.sector_1.actual" = "== \"\""

# on Kickstart 1.3 the original crashes at the start (#941)
[deviations."compiler=orig210,machine=a500"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"
