# rievallib-ctp-drops-characters.test.bas: the original drops the characters
# and evaluates the rest; the cells with the CD's libraries get the acidlibs
# of the library's variant (library 121 is the CD's polylib)
fixed-orig = 632
rwe = ["rievallib"]
files = ["blitz2/acidlibs|@TESTDATA@/../../../variants/rwe-1999-eval/acidlibs|libs=cd"]

[deviations."compiler=orig210"]
"check.dropped_characters.comma_postfix" = "== fail"
"check.dropped_characters.comma_postfix.actual" = "== \"1 2 \""
"check.dropped_characters.comma_result" = "== fail"
"check.dropped_characters.comma_result.actual" = "== 2"
"check.dropped_characters.comma_error" = "== fail"
"check.dropped_characters.comma_error.actual" = "== 0"
"check.dropped_characters.letter_postfix" = "== fail"
"check.dropped_characters.letter_postfix.actual" = "== \"12 3 + \""
"check.dropped_characters.letter_result" = "== fail"
"check.dropped_characters.letter_result.actual" = "== 15"
"check.dropped_characters.letter_error" = "== fail"
"check.dropped_characters.letter_error.actual" = "== 0"
