# ricompactdisclib-playtrack-scsi-test-values.test.bas: the A1200 with
# uaescsi.device and the library's CD image; the original plays the blocks
# 14000 to 15000 behind the image and returns 0 for the tracks 1 and 2
fixed-orig = 580
rwe = ["ricompactdisclib"]
uae = ["scsi=true", "cdimage0=@TESTDATA@/ricompactdisclib.cue,image"]

[deviations."compiler=orig210"]
"check.tracks.track1" = "== fail"
"check.tracks.track1.actual" = "== 0"
"check.tracks.track2" = "== fail"
"check.tracks.track2.actual" = "== 0"
