# rievallib-lessthan-unsigned-or-equal.test.bas: the original's "<" is
# "unsigned lower or same"; the cells with the CD's libraries get the
# acidlibs of the library's variant (library 121 is the CD's polylib)
fixed-orig = 638
rwe = ["rievallib"]
files = ["blitz2/acidlibs|@TESTDATA@/../../../variants/rwe-1999-eval/acidlibs|libs=cd"]

[deviations."compiler=orig210"]
"check.less_than.equal" = "== fail"
"check.less_than.equal.actual" = "== -1"
"check.less_than.negative_first" = "== fail"
"check.less_than.negative_first.actual" = "== 0"
"check.less_than.negative_second" = "== fail"
"check.less_than.negative_second.actual" = "== -1"
