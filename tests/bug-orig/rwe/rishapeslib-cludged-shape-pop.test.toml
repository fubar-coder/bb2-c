# rishapeslib-cludged-shape-pop.test.bas: the victim
# (rishapeslib-cludged-shape-pop.test/victim.bas, the job b000) runs from the
# editor in the compile phase of the cell, the compiler through inject, which
# checks afterwards that the file the program loaded is closed. The original
# returns past the cleanup of LELoadShapes with the stack unbalanced, the
# program goes on and the file stays in use
fixed-orig = 807
rwe = ["rishapeslib", "ripacklib", "riamosfunclib"]
files = ["s.le|@TESTDATA@/rishapeslib-cludged-shape-pop.le"]
wrap = "@INJECT@|inuse=CORPUS:s.le"
jobline = ["run=r001|CORPUS:src/b000.bb2|RAM:con"]
timeout = 120

[data]
"victim.bas" = "basic-compile"

[asserts]
"compile.inject" = "contains \"inject: not in use: CORPUS:s.le\""
"compile.log" = "contains \"OUTPUT\tr001\tloaded\n\""

[deviations."compiler=orig210"]
"compile.inject" = "contains \"inject: in use: CORPUS:s.le\""
