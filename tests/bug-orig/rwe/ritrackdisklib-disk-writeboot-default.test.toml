# ritrackdisklib-disk-writeboot-default.test.bas: a blank image in DF1 on the
# three machines; the original writes nothing
fixed-orig = 865
rwe = ["ritrackdisklib"]
floppy = ["1|@TESTDATA@/ritrackdisklib-blank.adf"]
timeout = 60
# the cells share a session per machine and trackdisk.device keeps the tracks
# the port's cell wrote in its buffer: the original's cells have their own
isolate = ["compiler=orig210"]

[matrix]
machine = ["a500", "a500-204", "a1200"]

[deviations."compiler=orig210,machine=a500-204"]
"check.default_block.writeboot" = "== fail"
"check.default_block.writeboot.actual" = "== 252"
"check.default_block.id" = "== fail"
"check.default_block.id.actual" = "== \"SEC\""
"check.default_block.id_byte" = "== fail"
"check.default_block.id_byte.actual" = "== 84"
"check.default_block.root_block" = "== fail"
"check.default_block.root_block.actual" = "== 808464384"
"check.default_block.sum" = "== fail"
"check.default_block.sum.actual" = "== -758672508"
"check.default_block.bootable" = "== fail"
"check.default_block.bootable.actual" = "== 0"

[deviations."compiler=orig210,machine=a1200"]
"check.default_block.writeboot" = "== fail"
"check.default_block.writeboot.actual" = "== 252"
"check.default_block.id" = "== fail"
"check.default_block.id.actual" = "== \"SEC\""
"check.default_block.id_byte" = "== fail"
"check.default_block.id_byte.actual" = "== 84"
"check.default_block.root_block" = "== fail"
"check.default_block.root_block.actual" = "== 808464384"
"check.default_block.sum" = "== fail"
"check.default_block.sum.actual" = "== -758672508"
"check.default_block.bootable" = "== fail"
"check.default_block.bootable.actual" = "== 0"

# on Kickstart 1.3 the original crashes at the start (#941)
[deviations."compiler=orig210,machine=a500"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"
