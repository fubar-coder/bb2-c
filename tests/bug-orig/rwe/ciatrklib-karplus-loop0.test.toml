# ciatrklib-karplus-loop0.test.bas: the original overwrites the memory from
# address 0 on and the CPU halts
fixed-orig = 439
rwe = ["ciatrklib"]
timeout = 30
files = ["k.mod|@TESTDATA@/ciatrklib-karplus-loop0.mod"]
# the crash ends the session: the original's cell has one of its own
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== halt"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
