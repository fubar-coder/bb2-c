# ricompactdisclib-opencd-scsiflag-kept.test.bas: the A1200 with uaescsi.device
# and the library's CD image; the original keeps the SCSI path and opens
# the device of the OpenCD before for OpenCD without arguments
fixed-orig = 577
rwe = ["ricompactdisclib"]
timeout = 60
uae = ["scsi=true", "cdimage0=@TESTDATA@/ricompactdisclib.cue,image"]

[deviations."compiler=orig210"]
"check.flag_kept.tracks" = "== fail"
"check.flag_kept.tracks.actual" = "== 2"
"check.flag_kept.open_default" = "== fail"
"check.flag_kept.open_default.actual" = "== -1"
