# riwbspritelib-v39-calls.test.bas: on the three machines; the original calls
# V39 functions behind graphics.library's jump table on Kickstart 1.3 (a500:
# "Software error - task held") and 2.04 (a500-204: the requester "Software
# Failure"); the session ends in a timeout. The A1200 runs it.
fixed-orig = 1151
rwe = ["riwbspritelib"]
timeout = 30

[matrix]
machine = ["a500", "a500-204", "a1200"]

[deviations."compiler=orig210,machine=a500"]
session = "== timeout"
requester = "contains \"Software error - task held\""
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"

[deviations."compiler=orig210,machine=a500-204"]
session = "== timeout"
requester = "contains \"Software Failure\""
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"

# on the A1200 the original runs and shows two other bugs of the library:
# MoveWBSprite returns the d0 of MoveSprite (#921), GetWBSprite returns the
# channel of a failed call (#920)
[deviations."compiler=orig210,machine=a1200"]
"check.sprites.moved" = "== fail"
"check.sprites.moved.actual" = "== 8"
"check.sprites.wide_refused" = "== fail"
"check.sprites.wide_refused.actual" = "== 0"
