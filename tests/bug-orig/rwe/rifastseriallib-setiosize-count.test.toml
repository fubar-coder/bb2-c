# rifastseriallib-setiosize-count.test.bas: with the serial port of the
# emulator; the original waits for a 17th byte (the session of its own ends
# in the time limit)
fixed-orig = 1158
rwe = ["rifastseriallib"]
serial = "on"
timeout = 30
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
