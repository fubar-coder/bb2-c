# rianimlib-anim7-odd-data-offset-68000.test.bas: on the A600 (68000) the
# original's odd reads are an address error; the session of its own ends in
# the hang check
fixed-orig = 1121
rwe = ["rianimlib", "ripacklib", "riamosfunclib"]
machine = "a600"
# hang-after: the first session of a machine boots cold and saves a snapshot (2.7 s alone,
# 13.6 s on a loaded host); the default 8 s of silence ended it
hang-after = 20
timeout = 40
files = ["anim|@TESTDATA@/rianimlib-anim7-odd-data-offset-68000.anim"]
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
requester = "contains \"Software Failure\""
