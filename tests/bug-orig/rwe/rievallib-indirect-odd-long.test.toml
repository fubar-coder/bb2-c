# rievallib-indirect-odd-long.test.bas: on the A600 (68000) the original's
# long read from an odd address is an address error; its session of its own
# ends in the time limit; the cells with the CD's libraries get the acidlibs
# of the library's variant (library 121 is the CD's polylib)
fixed-orig = 636
rwe = ["rievallib"]
machine = "a600"
timeout = 30
files = ["blitz2/acidlibs|@TESTDATA@/../../../variants/rwe-1999-eval/acidlibs|libs=cd"]
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software Failure\""
"end.case" = "not exists"
"end.run" = "not exists"
