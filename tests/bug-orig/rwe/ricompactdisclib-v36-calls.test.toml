# ricompactdisclib-v36-calls.test.bas: on the a500 (Kickstart 1.3); the
# original crashes at the start of the program
fixed-orig = 1138
rwe = ["ricompactdisclib"]
machine = "a500"
timeout = 30
# the crash ends the session: the original's cell has one of its own
isolate = ["compiler=orig210"]

[deviations."compiler=orig210"]
session = "== timeout"
rc = "not exists"
requester = "contains \"Software error - task held\""
"end.case" = "not exists"
"end.run" = "not exists"
