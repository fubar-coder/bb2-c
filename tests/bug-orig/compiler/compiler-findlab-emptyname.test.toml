# compiler-findlab-emptyname.test.bas: the correct result is a failed
# compile (Syntax Error at the "#" without a name) and nothing runs; the
# original searches the empty name and refuses with Constant Not Found
fixed-orig = 30

[asserts]
compile = "== \"error 9 Syntax Error\""
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"

[deviations."compiler=orig195"]
compile = "contains \"Constant Not Found\""
