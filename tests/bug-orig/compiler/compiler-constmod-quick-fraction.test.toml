# compiler-constmod-quick-fraction.test.bas: the original compiler runs into
# the division trap while folding the constants (#1219): a Software Failure,
# no compile result, the session ends at its limit
fixed-orig = 1219
isolate = ["compiler=orig195"]
timeout = 30

[deviations."compiler=orig195"]
compile = "== none"
session = "== timeout"
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
