# compiler-macrobuff-size.test.bas: the original's Macro Buffer keeps its
# 8192 bytes whatever the option says.  With the driver's own macros in the
# compile (the old test had none before the macro big) the original does not
# get as far as "Macro too Big" at the macro big: with macrobuf=16384 every
# compile of a driver hangs (also one without any macro of the test), which
# ends the session at its limit; a session of its own for the original
# compiler, and a short limit, as nothing runs after the hang
fixed-orig = 336
jobline = ["macrobuf=16384"]
isolate = ["compiler=orig195"]
timeout = 40

[deviations."compiler=orig195"]
compile = "== none"
session = "== timeout"
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
