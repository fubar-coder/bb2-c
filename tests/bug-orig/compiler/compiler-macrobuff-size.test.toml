# compiler-macrobuff-size.test.bas: the original's Macro Buffer keeps its
# 8192 bytes whatever the option says.  With the driver's own macros in the
# compile the original does not get as far as "Macro too Big" at the macro
# big: its compile ends in a way that depends on the memory (#965: the macro
# node is half built after an error, also at the default size), and any
# macrobuf other than 8192 hangs the original at its exit (#336).  So the
# original's cell declares only what holds every time: the session ends at
# its limit and the compile does not end ok.  A session of its own for the
# original compiler, and a short limit, as nothing runs after the hang
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 336
jobline = ["macrobuf=16384"]
isolate = ["compiler=orig195"]
timeout = 40

[deviations."compiler=orig195"]
compile = "!= ok"

[ends."compiler=orig195"]
reason = "the original's faulty part corrupts memory (#336): its end is not defined, it may crash, hang or halt"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists"]
abnormal_run_only = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run exists"]
