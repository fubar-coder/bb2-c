# compiler-constdiv-mod-word.test.bas: the correct result is a failed
# compile (Division by Zero at the line of a.w=5 Mod 0) and nothing runs;
# the original compiler runs into the division trap while folding the
# constants: a Software Failure, no compile result, the session ends at
# its limit
fixed-orig = 1044
timeout = 30

[asserts]
compile = "== \"error 12 Division by Zero\""
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"

[deviations."compiler=orig195"]
compile = "== none"
session = "== timeout"
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
