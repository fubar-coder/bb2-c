# compiler-loadres-clash-werror.test.bas: the correct result is a failed
# compile (Constant Not Found at #c) and the error in the compiler's log
# (XTRAERR of the job list); the original compiles and the case runs
fixed-orig = 36
files = ["r1.bb2|@TESTDATA@/compiler-loadres-clash-offset.r1", "r2.bb2|@TESTDATA@/compiler-loadres-clash-offset.r2"]
jobline = ["resident=r1|CORPUS:r1.bb2|CORPUS:out/r1.res", "resident=r2|CORPUS:r2.bb2|CORPUS:out/r2.res", "warnings=errors"]

[asserts]
compile = "contains \"Constant Not Found\""
"compile.log" = "contains \"XTRAERR\tj000\tClash in Residents: #c\n\""
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"

[deviations."compiler=orig195"]
compile = "== ok"
"compile.log" = "not contains \"Clash in Residents\""
"end.case" = "exists"
"end.run" = "exists"
rc = "== 0"
