# compiler-operand-order-print.test.bas: the original's output of the
# forms of #1216 (the lines where the original differs by #1178, q*100000,
# are #1178's fixed tests) is the declared deviation
fixed-orig = 1216

[asserts]
output = "== \"01 1+1+1+q 4.5\n02 w+v+q 8.5\n03 q+w+v 8.5\n04 w*v+q 13.5\n05 q+&l-&l 1.5\n06 Int(q)*100000 100000\n07 q+w/2 2\n08 w/2+q 2\n09 w+v+q -25535.5\n10 q+w+v -25535.5\n\""

[deviations."compiler=orig195"]
output = "== \"01 1+1+1+q 4\n02 w+v+q 8\n03 q+w+v 8.5\n04 w*v+q 13\n05 q+&l-&l 1\n06 Int(q)*100000 100000\n07 q+w/2 2\n08 w/2+q 1.5\n09 w+v+q -25536\n10 q+w+v -25535.5\n\""
