# compiler-procend-kind.test.bas: the correct result is a failed compile
# (Illegal End Procedure at the End Statement line) and nothing runs; the
# original compiles the Function and the program returns into the string
# buffer; its text "Nu" (an RTS) returns to the Gosub of the case, so the
# program ends without the end of the case (tests/README.md, "Alternative
# ends").
fixed-orig = 940
timeout = 30

[asserts]
compile = "== \"error 13 Illegal End Procedure\""
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"

[deviations."compiler=orig195"]
compile = "== ok"

[ends."compiler=orig195"]
reason = "the original returns to a wrong address (#940), the string buffer whose text \"Nu\" is an RTS: the program ends without the end of the case"
returns = ["session == done", "rc == 0", "end.case not exists", "end.run exists", "output contains \"Nu\"", "check.endstatement_in_function.after_f == not-run"]
