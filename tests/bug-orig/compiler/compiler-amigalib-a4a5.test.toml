# compiler-amigalib-a4a5.test.bas: the original's library call leaves a
# garbage base in a6: the child reads the local wrong and then the CPU
# halts; the original cell has a session of its own (after the port cell in
# the same session its driver ends at once with return code 20)
fixed-orig = 958
isolate = ["compiler=orig195"]
flaky = "the original's cell failed as the second cell of a session after a snapshot restore (rc 20, no result file); isolate = [\"compiler=orig195\"] is the workaround; cause not analysed (Q-A17)"

[data]
"child.bas" = "basic-compile"

[deviations."compiler=orig195"]
"run.child.child" = "== open"
"run.child.child.output" = "== \"local wrong\n\""
session = "== halt"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
