# with pad (the query compile.inject) and compiles with the resident of one
# constant, made by tedstub from the test's data before the job
fixed-orig = 34
wrap = "@INJECT@|pad"
files = ["r.bb2|@TESTDATA@/compiler-resconsts-last-next.res"]
