# compiler-pushdo-error-leak.test.bas: the compiler runs through inject with
# track; the compile is refused (Can't Convert Types at the assignment, in
# both compilers) and the correct result is that blitz2 leaves no
# allocation behind; the original leaves the 18 bytes of the saved code
fixed-orig = 994
wrap = "@INJECT@|track"

[asserts]
compile = "== \"error 12 Can't Convert Types\""
"compile.inject" = "== \"inject: rc=0\ninject: track: 0 allocations left, 0 bytes\n\""
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"

[deviations."compiler=orig195"]
"compile.inject" = "== \"inject: rc=0\ninject: track: 1 allocations left, 18 bytes\ninject:   18 bytes, flags $1\n\""
