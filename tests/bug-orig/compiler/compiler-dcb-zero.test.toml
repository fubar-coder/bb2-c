# compiler-dcb-zero.test.bas: the original's compiler runs 2^32 copies (the
# hang check ends the session): no program, no check; the cell has a session
# of its own so that the hang does not end the session of the port's cell
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 37
timeout = 30
isolate = ["compiler=orig195"]

[ends."compiler=orig195"]
reason = "the original's faulty part corrupts memory (#37): its end is not defined, it may crash, hang or halt"
abnormal = ["any"]
