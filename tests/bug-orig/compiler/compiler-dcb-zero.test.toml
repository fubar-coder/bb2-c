# compiler-dcb-zero.test.bas: the original's compiler runs 2^32 copies (the
# hang check ends the session): no program, no check; the cell has a session
# of its own so that the hang does not end the session of the port's cell
# (the copies stay inside the object buffer: pokebyte/pokewd skip a write at or
# behind libat and only count, 2^32 of them cannot reach the memory behind it
# limit), so the hang is the whole end
fixed-orig = 37
timeout = 30
isolate = ["compiler=orig195"]

[deviations."compiler=orig195"]
compile = "== none"
session = "== timeout"
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
