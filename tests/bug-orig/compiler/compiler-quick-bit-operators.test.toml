# compiler-quick-bit-operators.test.bas: the originals (1.95 and 2.10)
# compute NOT, AND, OR and EOR under a Quick type so far on the 16.16
# bits, the fraction included
fixed-orig = 1209
exclude = ["compiler=orig195,libs=clib", "compiler=orig210,libs=clib"]

[matrix]
compiler = ["port", "orig195", "orig210"]

[deviations."compiler=orig195"]
"check.flags.minus1" = "== fail"
"check.flags.minus1.actual" = "== $0000FFFF"
"check.flags.true" = "== fail"
"check.flags.true.actual" = "== $0000FFFF"
"check.flags.comparison" = "== fail"
"check.flags.comparison.actual" = "== $0000FFFF"
"check.flags.zero" = "== fail"
"check.flags.zero.actual" = "== $FFFFFFFF"
"check.flags.if_minus1" = "== fail"
"check.flags.if_minus1.actual" = "== $00010000"
"check.nots.three" = "== fail"
"check.nots.three.actual" = "== $FFFCFFFF"
"check.nots.constant" = "== fail"
"check.nots.constant.actual" = "== $FFFCFFFF"
"check.nots.half" = "== fail"
"check.nots.half.actual" = "== $FFFE7FFF"
"check.nots.negative" = "== fail"
"check.nots.negative.actual" = "== $00017FFF"
"check.nots.variable" = "== fail"
"check.nots.variable.actual" = "== $FFFE7FFF"
"check.bits.and" = "== fail"
"check.bits.and.actual" = "== $00008000"
"check.bits.or" = "== fail"
"check.bits.or.actual" = "== $00038000"
"check.bits.eor" = "== fail"
"check.bits.eor.actual" = "== $00028000"
"check.bits.amp" = "== fail"
"check.bits.amp.actual" = "== $00008000"
"check.bits.bar" = "== fail"
