# compiler-newtype-forward-early-local.test.bas: the correct result is a failed
# compile (Type not yet defined at End Statement) and nothing runs; the
# original compiles and the case runs
fixed-orig = 974

[asserts]
compile = "== \"error 14 Type not yet defined\""
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"

[deviations."compiler=orig195"]
compile = "== ok"
"end.case" = "exists"
"end.run" = "exists"
rc = "== 0"
