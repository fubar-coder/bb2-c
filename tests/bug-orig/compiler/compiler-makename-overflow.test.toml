# compiler-makename-overflow.test.bas: the correct result is a failed compile
# (Syntax Error at the call with the name of 128 characters) and nothing
# runs; the original accepts the name and the case runs
fixed-orig = 29

[asserts]
compile = "== \"error 14 Syntax Error\""
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"

[deviations."compiler=orig195"]
compile = "== ok"
"end.case" = "exists"
"end.run" = "exists"
rc = "== 0"
