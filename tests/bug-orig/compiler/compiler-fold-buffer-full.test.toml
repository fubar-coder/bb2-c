# compiler-fold-buffer-full.test.bas: the object buffer of 2992 bytes (the
# default of the old test); the original's compile of the child crashes
# (the CPU halts); the end is the same on every run, see the reason below.
fixed-orig = 1190
jobline = ["objbuf=2992"]
isolate = ["compiler=orig195"]

[data]
"child.bas" = "basic-compile"

[deviations."compiler=orig195"]
"data.child.bas" = "== none"

[ends."compiler=orig195"]
reason = "the original's compile of the child runs on from the folded operands into the library area behind the object buffer (#1190), whose head is the first library copied: memlib, because the first statement of the child is Dim (another first statement makes another library the first one); the compiler never comes back and the emulated CPU halts, as on every measured run"
halts = ["session == halt", "rc not exists", "end.case not exists", "end.run not exists"]
