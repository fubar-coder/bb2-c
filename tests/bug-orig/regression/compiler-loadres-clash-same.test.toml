# two residents made of the same source: #c is 1 in both, the compile log has no warning
files = ["r1.bb2|@TESTDATA@/compiler-loadres-clash-offset.r1", "r2.bb2|@TESTDATA@/compiler-loadres-clash-offset.r1"]
jobline = ["resident=r1|CORPUS:r1.bb2|CORPUS:out/r1.res", "resident=r2|CORPUS:r2.bb2|CORPUS:out/r2.res"]

[asserts]
"compile.log" = "not contains \"XTRAERR\""
