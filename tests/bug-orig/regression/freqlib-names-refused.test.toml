# the drawer the requester shows; inject answers the requesters by clicks (one
# window title per call), and reports each click it answered
dirs = ["fqname"]
runwrap = "@INJECT@|click=F1/a123456789b123456789c123456 click=F1/OK click=F2/k123456789k123456789k123456 click=F2/OK"
timeout = 120

[asserts]
inject = "contains \"inject: click F1/a123456789b123456789c123456: answered\ninject: click F1/OK: answered\ninject: click F2/k123456789k123456789k123456: answered\ninject: click F2/OK: answered\""
