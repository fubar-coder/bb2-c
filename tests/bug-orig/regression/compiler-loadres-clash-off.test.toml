# the residents r1 and r2 define #c as 1 and 2; the warnings setting is off, so the
# compile log has no warning
files = ["r1.bb2|@TESTDATA@/compiler-loadres-clash-offset.r1", "r2.bb2|@TESTDATA@/compiler-loadres-clash-offset.r2"]
jobline = ["resident=r1|CORPUS:r1.bb2|CORPUS:out/r1.res", "resident=r2|CORPUS:r2.bb2|CORPUS:out/r2.res", "warnings=off"]

[asserts]
"compile.log" = "not contains \"XTRAERR\""
