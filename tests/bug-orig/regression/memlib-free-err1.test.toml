# through inject with track: what the process leaves allocated; the trap
# handler of the program ends it, so the case has no end entry (the run has)
runwrap = "@INJECT@|track"

[asserts]
inject = "contains \"inject: track: 0 allocations left, 0 bytes\""
"end.case" = "not exists"
"check.out_of_memory_in_recursion.after_deep" = "== not-run"
