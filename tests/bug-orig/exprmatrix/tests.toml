# tests.toml of tests/bug-orig/exprmatrix: the tests of the expression matrix's
# agreement, baseline and fixed cells (generated by tools/exprmatrix) run in four
# cells, as the corpus passes did: the port with the C libraries (the side port)
# and with the CD's libraries, and the CD's blitz2 2.10 with the CD's and with
# the C libraries; a fixed cell declares the original's value as the deviation
# of the cells with the faulty part (compiler=orig210 or libs=cd)

[matrix]
compiler = ["port", "orig210"]
libs = ["cd", "clib"]
