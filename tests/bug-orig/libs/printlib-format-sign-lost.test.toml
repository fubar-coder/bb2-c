# printlib-format-sign-lost.test.bas: what NPrint prints is the observation
# of the output
fixed-orig = 237

[asserts]
output = "== \"a < -7> <  7>\nb < -2.5 >\nc <-07>\nd <   -7>\n\""

[deviations."libs=cd"]
"check.sign_lost.minus" = "== fail"
"check.sign_lost.minus.actual" = "== \"  7\""
"check.sign_lost.fraction" = "== fail"
"check.sign_lost.zeros" = "== fail"
"check.sign_lost.comma" = "== fail"
output = "== \"a <  7> <  7>\nb <  2.5 >\nc <007>\nd <    7>\n\""
