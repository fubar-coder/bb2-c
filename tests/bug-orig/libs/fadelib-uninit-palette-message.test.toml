# fadelib-uninit-palette-message.test.bas: with runtime error checking; the
# requester with its text is the tested behaviour, the case ends in it
# and the check behind the FadeIn does not run
fixed-orig = 330
runtime-errors = "on"

[asserts]
requester = "contains \"Uninitialized Palette\""
"end.case" = "not exists"
"check.palette_missing.faded" = "== not-run"

[deviations."libs=cd"]
requester = "contains \"Not enough colours in Slice\""
