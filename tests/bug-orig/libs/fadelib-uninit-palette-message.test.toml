# fadelib-uninit-palette-message.test.bas: with runtime error checking for
# the announced error; the original raises another one, so the announcement
# fails there
fixed-orig = 330
runtime-errors = "on"

[asserts]
"check.palette_missing.faded" = "== not-run"

[deviations."libs=cd"]
"check.palette_missing.refused" = "== fail"
requester = "contains \"Not enough colours in Slice\""
"end.case" = "not exists"
