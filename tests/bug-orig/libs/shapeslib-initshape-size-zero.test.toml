# shapeslib-initshape-size-zero.test.bas: with runtime error checking for
# the announced error; the original raises no error, so the announcement
# fails there and the case runs on to its check
fixed-orig = 1047
runtime-errors = "on"

[asserts]
"check.size_zero.after" = "== not-run"

[deviations."libs=cd"]
"check.size_zero.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.size_zero.after" = "== fail"
