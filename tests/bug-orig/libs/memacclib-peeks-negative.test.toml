# memacclib-peeks-negative.test.bas: the original copies up to 4 GB into the
# string buffer and the program does not come back (the session runs into
# its time limit, the hang check ends it; the same on 5 of 5 runs measured)
fixed-orig = 214

[deviations."libs=cd"]
session = "== timeout"
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
