# polylib-renderpoly-colour-check.test.bas: with runtime error checking for
# the announced error; the original raises none, so the announcement fails
# there and the case runs on to its check
fixed-orig = 422
runtime-errors = "on"

[asserts]
"check.colour_15.after" = "== not-run"

[deviations."libs=cd"]
"check.colour_15.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.colour_15.after" = "== fail"
