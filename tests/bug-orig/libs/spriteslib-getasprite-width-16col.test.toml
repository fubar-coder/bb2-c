# spriteslib-getasprite-width-16col.test.bas: with runtime error checking
# for the announced error; the original raises none, so the announcement
# fails there and the case runs on to its check
fixed-orig = 988
runtime-errors = "on"

[asserts]
"check.width_128_16col.after" = "== not-run"

[deviations."libs=cd"]
"check.width_128_16col.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.width_128_16col.after" = "== fail"
