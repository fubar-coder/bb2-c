# shapetrixlib-scale-plane-64k.test.bas: with runtime error checking for
# the announced error; the original raises none, so the announcement fails
# there and the case runs on to its check
fixed-orig = 1047
runtime-errors = "on"
timeout = 300

[asserts]
"check.scale_plane_64k.after" = "== not-run"

[deviations."libs=cd"]
"check.scale_plane_64k.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.scale_plane_64k.after" = "== fail"
