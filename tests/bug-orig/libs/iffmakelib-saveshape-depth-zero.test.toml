# iffmakelib-saveshape-depth-zero.test.bas: the handler of the expected
# error holds the check and ends the program, so the case has no end entry.
# The original overwrites its own code: a crash ("Software Failure", the
# session runs into its timeout; each cell with the CD's libraries has its
# own session).
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 326
isolate = ["libs=cd"]

[asserts]
"end.case" = "not exists"
"check.depth_zero.not_refused" = "== not-run"

[ends."libs=cd"]
reason = "the original's faulty part corrupts memory (#326): its end is not defined, it may crash, hang or halt"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists", "check.depth_zero.refused != ok"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists", "check.depth_zero.refused != ok"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists", "check.depth_zero.refused != ok"]
abnormal_run_only = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run exists", "check.depth_zero.refused != ok"]
