# blitzcoplib-customcop-short.test.bas: the original copies 2^32 longs over
# the memory behind the copper list and does not come back: the session runs
# into its timeout; each cell with the CD's libraries has its own session
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 404
timeout = 30
isolate = ["libs=cd"]

[ends."libs=cd"]
reason = "the original's faulty part corrupts memory (#404): its end is not defined, it may crash, hang or halt"
abnormal = ["any", "check.empty_string.after != ok"]
