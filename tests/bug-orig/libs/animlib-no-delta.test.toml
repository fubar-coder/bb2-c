# animlib-no-delta.test.bas: the ANIM is staged as CORPUS:nodelta.anim.  The
# original's NextFrame reads a delta node at address 0 and writes from what
# it finds there.
fixed-orig = 401
files = ["nodelta.anim|@TESTDATA@/animlib-no-delta.anim"]

[deviations."libs=cd"]
"check.no_delta.row" = "== fail"
"check.no_delta.row.actual" = "== $AAE2"

[ends."libs=cd"]
reason = "the original's NextFrame writes through address 0 (the exception vectors); whether the session then still reports the program's exit code depends on what the write hit: with the port's compiler it does, with the original's the session ends without it"
returns = ["rc == 0"]
no_exit_code = ["rc not exists"]
abnormal = ["any", "check.no_delta.row != ok"]
