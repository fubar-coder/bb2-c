# bitmaplib-cludgebitmap-size-check.test.bas: with runtime error checking
# for the announced error; the original raises none, so the announcement
# fails there and the case runs on to its check
fixed-orig = 78
runtime-errors = "on"

[asserts]
"check.height_zero.after" = "== not-run"

[deviations."libs=cd"]
"check.height_zero.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.height_zero.after" = "== fail"
