# blitzoslib-spotbox-no-page.test.bas: with runtime error checking; the
# original has no check and scans the memory behind the page
fixed-orig = 83
runtime-errors = "on"
timeout = 30

[asserts]
"check.no_page.not_refused" = "== not-run"

[deviations."libs=cd"]
"check.no_page.refused" = "== fail"
"check.no_page.not_refused" = "== fail"
requester = "count == 0"
