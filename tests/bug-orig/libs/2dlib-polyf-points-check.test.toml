# 2dlib-polyf-points-check.test.bas: with runtime error checking for the
# announced error; the original raises none and overwrites its code.  What
# the overwritten code then does depends on the compiler's code layout (see
# the ends); each cell with the CD's libraries has its own session, since
# one of the ends is a hang.
fixed-orig = 395
runtime-errors = "on"
isolate = ["libs=cd"]

[asserts]
"check.points_17.after" = "== not-run"

[ends."libs=cd"]
reason = "the original copies the 17 points behind a buffer of 16 and overwrites the code of the library (#395); what the overwritten code does depends on the code layout of the program (tests/README.md \"The original's end follows the link layout\"): with both compilers the CPU runs into an illegal instruction (measured 5 of 5 runs per cell; the requester is answered and the case ends)"
guru_requester = ["requester contains \"GURU! - ILLEGAL Instruction\"", "end.case not exists", "check.points_17.refused == fail"]
