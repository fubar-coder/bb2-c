# shapeslib-decodeshapes-null.test.bas: the trap handler of the program
# continues at the label rec; the checks behind the faulty statements
# (no_error_1, no_error_2) are reached only if no error is raised.  The
# original's branch lands behind the library: with this program's code
# layout that is a crash ("Software Failure", the session runs into its
# timeout); where it ends otherwise depends on the code behind the
# library.  Every cell with the CD's libraries crashes in its own
# session (a crash ends the session).
fixed-orig = 270
timeout = 60
isolate = ["libs=cd"]

[asserts]
"check.null_address.no_error_1" = "== not-run"
"check.null_address.no_error_2" = "== not-run"

[deviations."libs=cd"]
session = "== timeout"
requester = "contains \"Software Failure\""
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
