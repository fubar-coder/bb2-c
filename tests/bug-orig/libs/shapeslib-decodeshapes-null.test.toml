# shapeslib-decodeshapes-null.test.bas: the trap handler of the program
# continues at the label rec; the checks behind the faulty statements
# (no_error_1, no_error_2) are reached only if no error is raised.  The
# original's branch lands behind the library; where it ends depends on the
# code behind the library, that is on the layout of the test program: it
# crashes, hangs or returns without the error (the alternatives below).
# Every cell with the CD's libraries runs in its own session (a crash ends
# the session).
fixed-orig = 270
timeout = 60
isolate = ["libs=cd"]

[asserts]
"check.null_address.no_error_1" = "== not-run"
"check.null_address.no_error_2" = "== not-run"

[ends."libs=cd"]
reason = "the original's error branch lands behind the library (#270): a jump into other code, so the end is not defined; what runs there depends on the code layout of the test program: it can crash, hang or return without the error, so that the checks behind the faulty statements run and fail"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists"]
returns = ["session == done", "rc == 0", "end.case exists", "check.null_address.no_error_1 == fail", "check.null_address.no_error_2 == fail"]
