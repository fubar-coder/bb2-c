# ldivlib-div0-check-long.test.bas: only with runtime error checking; the
# check behind the error must not run.  The original's longdiv has no error
# check: no requester, the case goes on.  Since type-system-rework (#1235,
# task 4.7) the port's compiler tests the divisor before longdiv (the
# division trap, reported the same) with the CD's libraries too: only the
# original compiler reaches the CD's longdiv without its check
fixed-orig = 200
runtime-errors = "on"

[asserts]
"check.divisor_zero.after" = "== not-run"

[deviations."compiler=orig195,libs=cd"]
"check.divisor_zero.refused" = "== fail"
"check.divisor_zero.after" = "== fail"
requester = "count == 0"
