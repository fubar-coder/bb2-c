# stringfunclib-cvi-length-check.test.bas: with runtime error checking; the
# original raises no error and goes on to the check behind the statement
fixed-orig = 288
runtime-errors = "on"

[asserts]
"check.short_cvi.not_refused" = "== not-run"

[deviations."libs=cd"]
"check.short_cvi.refused" = "== fail"
"check.short_cvi.not_refused" = "== fail"
requester = "count == 0"
