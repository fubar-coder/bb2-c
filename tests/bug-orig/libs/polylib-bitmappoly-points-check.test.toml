# polylib-bitmappoly-points-check.test.bas: with runtime error checking; the requester with its text
# is the tested behaviour, the case ends in it and the check behind the
# command does not run (no !ExpectError: the original shows a crash requester instead)
fixed-orig = 395
runtime-errors = "on"

[asserts]
requester = "contains \"Too Many Points\""
"end.case" = "not exists"
"check.points_17.after" = "== not-run"

[deviations."libs=cd"]
requester = "contains \"GURU! - ILLEGAL Instruction\""
