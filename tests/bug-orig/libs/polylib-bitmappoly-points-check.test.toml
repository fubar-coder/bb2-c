# polylib-bitmappoly-points-check.test.bas: with runtime error checking for
# the announced error; the original shows a crash requester, so the
# announcement fails there
fixed-orig = 395
runtime-errors = "on"

[asserts]
"check.points_17.after" = "== not-run"

[deviations."libs=cd"]
"check.points_17.refused" = "== fail"
requester = "contains \"GURU! - ILLEGAL Instruction\""
"end.case" = "not exists"
