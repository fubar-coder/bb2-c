# displaylib-errors-errarea.test.bas: the trap handler of the program
# continues at the label rec, which ends the program, so the case has no end
# entry and the check behind the InitCopList is not run.  The original's
# branch lands in the library the compiler copies behind displaylib; the
# test makes that spriteslib (see the source), so the original returns
# without the error and the case goes on to the check.
fixed-orig = 412
isolate = ["libs=cd"]

[asserts]
"end.case" = "not exists"
"check.nine_planes.no_trap" = "== not-run"

[ends."libs=cd"]
reason = "the original's branch lands behind the library (#412), in the head of spriteslib, the library the compiler copies there (the layout of the test program: DisplayOn behind a Goto makes the compiler copy library 65510, which displaylib's calls pull in, before displaylib, so spriteslib follows it); the head sets spriteslib's variables and returns, so InitCopList returns without the error and the check no_trap fails"
returns = ["session == done", "rc == 0", "end.case exists", "check.nine_planes.no_trap == fail"]
