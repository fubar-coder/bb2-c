# displaylib-errors-errarea.test.bas: the trap handler of the program
# continues at the label rec, which ends the program, so the case has no end
# entry and the check behind the InitCopList is not run.  The original runs
# into other code: how that ends (a crash with the "Software Failure"
# requester, a hang) is not defined; each cell with the CD's libraries has
# its own session.
fixed-orig = 412
isolate = ["libs=cd"]

[asserts]
"end.case" = "not exists"
"check.nine_planes.no_trap" = "== not-run"

[ends."libs=cd"]
reason = "the original runs into other code (#412): a jump into data, so the end is not defined; it crashes (the Software Failure requester is written more or less before the session ends) or hangs"
abnormal = ["any"]
