# displaylib-errors-errarea.test.bas: the trap handler of the program
# continues at the label rec, which ends the program, so the case has no end
# entry and the check behind the InitCopList is not run.  The original runs
# into other code: a crash ("Software Failure", the session runs into its
# timeout; each cell with the CD's libraries has its own session).
fixed-orig = 412
timeout = 60
isolate = ["libs=cd"]

[asserts]
"end.case" = "not exists"
"check.nine_planes.no_trap" = "== not-run"

[ends."libs=cd"]
reason = "the original runs into other code and crashes; the Software Failure requester is written more or less before the session ends (a run showed only the start of its EasyRequest line)"
crash = ["session == timeout", "requester contains \"Software Failure\"", "rc not exists", "end.run not exists"]
crash_partial = ["session == timeout", "requester contains \"EasyRequest title \"", "rc not exists", "end.run not exists"]
