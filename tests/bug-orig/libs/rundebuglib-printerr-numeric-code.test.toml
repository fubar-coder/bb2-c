# rundebuglib-printerr-numeric-code.test.bas: with runtime error checking;
# the original's requester shows an empty text
fixed-orig = 6
runtime-errors = "on"

[data]
"noend.bas" = "basic-compile"

[asserts]
"check.used_object.not_stopped" = "== not-run"
"check.offset_range.not_stopped" = "== not-run"
"check.end_of_program.not_stopped" = "== not-run"

[deviations."libs=cd"]
"check.used_object.message" = "== fail"
"check.offset_range.message" = "== fail"
"check.end_of_program.message" = "== fail"
requester = "count == 1"
"end.case" = "not exists"

# the child that runs off its end: the requester of its end is the case's;
# the original's shows the empty text, and the case itself ends
[asserts."case=end_of_program_run"]
requester = "contains \"End of Program\""

[deviations."libs=cd,case=end_of_program_run"]
requester = "contains \"AutoRequest body \\\"\\\" pos\""
"end.case" = "exists"
