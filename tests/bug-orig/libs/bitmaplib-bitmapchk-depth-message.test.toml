# bitmaplib-bitmapchk-depth-message.test.bas: with runtime error checking
# for the announced error; the original raises another one, so the
# announcement fails there
fixed-orig = 1040
runtime-errors = "on"

[asserts]
"check.depth_zero.after" = "== not-run"

[deviations."libs=cd"]
"check.depth_zero.refused" = "== fail"
requester = "not contains \"Illegal BitMap Depth\""
"end.case" = "not exists"
