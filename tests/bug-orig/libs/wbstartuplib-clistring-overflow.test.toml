# wbstartuplib-clistring-overflow.test.bas: the program is started with an
# argument of 306 characters (abc, 300 x, xyz); the original copies it into
# cliString without a limit and the excess bytes overwrite what is behind
# it: cliString is the last thing of the library before its error check
# area, which is not linked without runtime error checking, so they land in
# the head of the library linked after wbstartuplib. What happens then
# follows the link layout of the test program: here the original crashes at
# its start, before the first check; with another neighbour (the old test's
# child) it kept 288 characters. A change of the link layout of the model
# program (testlib, driver) needs the deviations declared again.
fixed-orig = 308
timeout = 60
runargs = ""

[deviations."libs=cd"]
requester = "contains \"Software Failure\""
session = "== timeout"
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"
