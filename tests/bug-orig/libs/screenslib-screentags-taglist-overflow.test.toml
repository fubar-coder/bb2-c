# screenslib-screentags-taglist-overflow.test.bas: the original runs into
# the overwritten code (an illegal instruction, caught by the handler,
# which fails the check "illegal_instruction" and ends the program, so the
# case has no end entry) and the program's end then runs into the
# overwritten code too: a crash with the "Software Failure" requester (the
# session runs into its timeout; each cell with the CD's libraries has its
# own session).  The old recording noted that more or less of the requester
# (even none) is written before the session ends; both cells showed it
# here.
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 249
timeout = 60
isolate = ["libs=cd"]

[deviations."libs=cd"]
"check.taglist_overflow.illegal_instruction" = "== fail"

[ends."libs=cd"]
reason = "the original's faulty part corrupts memory (#249): its end is not defined, it may crash, hang or halt"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists", "check.taglist_overflow.screen_x != ok"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists", "check.taglist_overflow.screen_x != ok"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists", "check.taglist_overflow.screen_x != ok"]
abnormal_run_only = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run exists", "check.taglist_overflow.screen_x != ok"]
