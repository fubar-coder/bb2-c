# collslib-scoll-same-pair.test.bas: with runtime error checking for the
# announced error; the original raises none, so the announcement fails
# there and the case runs on to its check
fixed-orig = 110
runtime-errors = "on"

[asserts]
"check.same_pair.after" = "== not-run"

[deviations."libs=cd"]
"check.same_pair.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.same_pair.after" = "== fail"
