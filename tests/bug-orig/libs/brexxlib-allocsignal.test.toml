# brexxlib-allocsignal.test.bas: through inject without a free signal; the
# CD's libraries wait in PlayWait forever (the run is ended as a hang)
fixed-orig = 104
runwrap = "@INJECT@|signals"
timeout = 30

[deviations."libs=cd"]
session = "== timeout"
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
