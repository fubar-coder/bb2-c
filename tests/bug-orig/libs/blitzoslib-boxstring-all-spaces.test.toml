# blitzoslib-boxstring-all-spaces.test.bas: the original copies 65535 bytes
# into the string buffer; with a string buffer of 300000 bytes (jobline
# strbuf) the copy stays inside it and the program ends the same way on
# every run, the check of the length fails with 65535
fixed-orig = 85
jobline = ["strbuf=300000"]

[deviations."libs=cd"]
"check.all_spaces.length" = "== fail"
"check.all_spaces.length.actual" = "== 65535"
