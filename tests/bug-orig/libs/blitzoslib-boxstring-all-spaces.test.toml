# blitzoslib-boxstring-all-spaces.test.bas: the original copies 65535 bytes
# into the string buffer and ends abnormally; where and how depends on the
# code layout of the cell and the memory (a Software Failure, a hang, a halt;
# with the original compiler the program has gone through the end of the case
# and of the run): the end is declared as the general alternative of memory
# corruption (tests/README.md, "Alternative ends").  The check behind the
# copy is `!= ok`: it is not reached (the string buffer holds the test
# library's data too) or it fails with the length 65535.
fixed-orig = 85
timeout = 30

[ends."libs=cd"]
reason = "the original copies 65535 bytes into the string buffer (#85): memory corruption, so the end is not defined"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists", "check.all_spaces.length != ok"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists", "check.all_spaces.length != ok"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists", "check.all_spaces.length != ok"]
