# spriteslib-spritemode-table.test.bas: with runtime error checking; the requester with its text
# is the tested behaviour, the case ends in it and the check behind the
# command does not run (no !ExpectError: the original raises no error)
fixed-orig = 281
runtime-errors = "on"

[asserts]
requester = "contains \"Illegal SpriteMode\""
"end.case" = "not exists"
"check.spritemode_3.after" = "== not-run"

[deviations."libs=cd"]
requester = "count == 0"
"end.case" = "exists"
"check.spritemode_3.after" = "== fail"
