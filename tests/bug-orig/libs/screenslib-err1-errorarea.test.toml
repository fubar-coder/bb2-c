# screenslib-err1-errorarea.test.bas: the trap handler of the program
# continues at the labels rec1 and rec2; the checks behind the faulty
# statements (no_error_N) are reached only if no error is raised.  The
# original shows a garbage text for the first error (read from the memory
# its pointer leads to, so the deviation says that it is not the message)
# and runs into other code for the second: a crash ("Software Failure", the
# session runs into its timeout; each cell with the CD's libraries has its
# own session).
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 251
timeout = 60
isolate = ["libs=cd"]

[asserts]
"check.messages.no_error_1" = "== not-run"
"check.messages.no_error_2" = "== not-run"

[deviations."libs=cd"]
"check.messages.message_1" = "== fail"
"check.messages.message_1.actual" = "!= \"Can't find Screen\""

[ends."libs=cd"]
reason = "the original's faulty part corrupts memory (#251): its end is not defined, it may crash, hang or halt"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists"]
abnormal_run_only = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run exists"]
