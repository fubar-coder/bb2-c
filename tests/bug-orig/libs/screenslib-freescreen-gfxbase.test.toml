# screenslib-freescreen-gfxbase.test.bas: the original calls FreeDBufInfo
# through garbage: a crash with the "Software Failure" requester (the
# session runs into its timeout; each cell with the CD's libraries has its
# own session).  The old recording noted that more or less of the requester
# (even none) is written before the session ends; both cells showed it
# here.
# The end is not defined (memory corruption): the general alternatives of
# tests/README.md, "Alternative ends".
fixed-orig = 247
timeout = 30
isolate = ["libs=cd"]

[ends."libs=cd"]
reason = "the original's faulty part corrupts memory (#247): its end is not defined, it may crash, hang or halt"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists", "check.second_screen.after != ok"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists", "check.second_screen.after != ok"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists", "check.second_screen.after != ok"]
abnormal_run_only = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run exists", "check.second_screen.after != ok"]
