# shapeslib-initshape-depth-zero.test.bas: with runtime error checking for
# the announced error; the original raises none, so the announcement fails
# there and the case runs on to its check
fixed-orig = 243
runtime-errors = "on"

[asserts]
"check.depth_zero.after" = "== not-run"

[deviations."libs=cd"]
"check.depth_zero.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.depth_zero.after" = "== fail"
