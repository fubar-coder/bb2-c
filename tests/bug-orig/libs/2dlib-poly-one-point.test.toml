# 2dlib-poly-one-point.test.bas: with runtime error checking for the
# announced error; the original raises none, so the announcement fails
# there and the case runs on to its check
fixed-orig = 396
runtime-errors = "on"

[asserts]
"check.one_point.after" = "== not-run"

[deviations."libs=cd"]
"check.one_point.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.one_point.after" = "== fail"
