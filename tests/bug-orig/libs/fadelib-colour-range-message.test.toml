# fadelib-colour-range-message.test.bas: with runtime error checking for
# the announced error; the original raises another one, so the announcement
# fails there
fixed-orig = 331
runtime-errors = "on"

[asserts]
"check.colour_beyond.faded" = "== not-run"

[deviations."libs=cd"]
"check.colour_beyond.refused" = "== fail"
requester = "contains \"Uninitialized Slice\""
"end.case" = "not exists"
