# screenslib-screentags-pairs-limit.test.bas: with runtime error checking
# for the announced error; the original raises none, so the announcement
# fails there and the case runs on to its check
fixed-orig = 1039
runtime-errors = "on"

[asserts]
"check.sixteen_pairs.opened" = "== not-run"

[deviations."libs=cd"]
"check.sixteen_pairs.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.sixteen_pairs.opened" = "== ok"
