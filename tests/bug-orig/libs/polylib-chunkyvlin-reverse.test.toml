# polylib-chunkyvlin-reverse.test.bas: with runtime error checking for the
# announced error; the original raises none, so the announcement fails
# there and the case runs on to its check
fixed-orig = 417
runtime-errors = "on"

[asserts]
"check.reverse_range.after" = "== not-run"

[deviations."libs=cd"]
"check.reverse_range.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.reverse_range.after" = "== fail"
