# polylib-chunkyvlin-reverse.test.bas: with runtime error checking; the requester with its text
# is the tested behaviour, the case ends in it and the check behind the
# command does not run (no !ExpectError: the original raises no error)
fixed-orig = 417
runtime-errors = "on"

[asserts]
requester = "contains \"ChunkyVlin y1 MUST NOT be greater than y2\""
"end.case" = "not exists"
"check.reverse_range.after" = "== not-run"

[deviations."libs=cd"]
requester = "count == 0"
"end.case" = "exists"
"check.reverse_range.after" = "== fail"
