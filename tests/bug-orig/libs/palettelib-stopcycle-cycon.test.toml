# palettelib-stopcycle-cycon.test.bas: the original's second Cycle installs
# nothing (the flag cycon stays set); the program's end then runs into
# trouble (see the ends); each cell with the CD's libraries has its own
# session, since both ends are a hang or a halt
fixed-orig = 228
timeout = 120
isolate = ["libs=cd"]

[ends."libs=cd"]
reason = "the original hangs at the end of the program in some memory layouts (#228, not the tested behaviour): the CPU halts or the session runs into its timeout (before the program's end entries are written or behind them); the checks are written to the result file in a buffer that the crash can lose, so the check of the second Cycle is failed (the original's bug) or never written"
abnormal = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run not exists", "check.cycle_stop_cycle.second_cycle != ok"]
abnormal_after_case = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run not exists", "check.cycle_stop_cycle.second_cycle != ok"]
abnormal_after_run = ["session != done", "rc not exists", "requester count >= 0", "end.case exists", "end.run exists", "check.cycle_stop_cycle.second_cycle != ok"]
abnormal_run_only = ["session != done", "rc not exists", "requester count >= 0", "end.case not exists", "end.run exists", "check.cycle_stop_cycle.second_cycle != ok"]
