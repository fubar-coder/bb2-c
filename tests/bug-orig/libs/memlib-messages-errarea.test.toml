# memlib-messages-errarea.test.bas: without runtime error checking; the
# case's own trap handler takes the message; the original's d0 points behind
# the library (a garbage text)
fixed-orig = 956
timeout = 60

[asserts]
"check.trap_message.trapped" = "== not-run"

[deviations."libs=cd"]
"check.trap_message.message" = "== fail"
