# menuslib-menuchecked-sub-loops.test.bas: the CD's libraries do not find
# the checked subitem; for (0,1,1) the item loop and the subitem loop both
# jump back with the counter at -1, so the walk makes 65536 passes of the
# item loop, about 2^32 register steps without a memory access of its own;
# on the original's libraries it returns after about 26 s (measured, JIT,
# cpu_speed=max), so the silence limit is well above that
fixed-orig = 217
# two cells share a session: about 26 s each on the originals side
timeout = 240
hang-after = 90

[deviations."libs=cd"]
"check.checked_subitems.item_1_sub_0" = "== fail"
"check.checked_subitems.item_1_sub_0.actual" = "== 0"
