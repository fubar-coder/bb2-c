# iffmakelib-zero-colours.test.bas: with runtime error checking for the
# announced error; the original raises another one, so the announcement
# fails there
fixed-orig = 182
runtime-errors = "on"

[asserts]
"check.empty_palette.saved" = "== not-run"

[deviations."libs=cd"]
"check.empty_palette.refused" = "== fail"
requester = "contains \"Can't open File\""
"end.case" = "not exists"
