# shapeslib-initshape-blitsize-width.test.bas: with runtime error checking
# for the announced error; the original raises none, so the announcement
# fails there and the case runs on to its check
fixed-orig = 1046
runtime-errors = "on"

[asserts]
"check.blitsize_width.after" = "== not-run"

[deviations."libs=cd"]
"check.blitsize_width.refused" = "== fail"
requester = "count == 0"
"end.case" = "exists"
"check.blitsize_width.after" = "== fail"
