# ilbmifflib-bitmap-ignores-init.test.bas: with runtime error checking for
# the announced error; the original raises another one, so the announcement
# fails there
fixed-orig = 187
runtime-errors = "on"

[asserts]
"check.missing_file.loaded" = "== not-run"

[deviations."libs=cd"]
"check.missing_file.refused" = "== fail"
requester = "contains \"Can't Find IFF 'BODY'\""
"end.case" = "not exists"
