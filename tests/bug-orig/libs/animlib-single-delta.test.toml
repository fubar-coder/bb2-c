# animlib-single-delta.test.bas: the ANIM is staged as CORPUS:onedelta.anim.
# The original's current delta becomes 0 after the first NextFrame, and the
# second one reads a delta node at address 0 and writes from what it finds
# there.
fixed-orig = 401
files = ["onedelta.anim|@TESTDATA@/animlib-single-delta.anim"]

[deviations."libs=cd"]
"check.single_delta.current_1" = "== fail"
"check.single_delta.row_2" = "== fail"
"check.single_delta.row_2.actual" = "== $CCE2"
"check.single_delta.current_2" = "== fail"

[ends."libs=cd"]
reason = "the original's second NextFrame writes through address 0 (the exception vectors); whether the session then still reports the program's exit code depends on what the write hit: with the port's compiler it does, with the original's the session ends without it"
returns = ["rc == 0"]
no_exit_code = ["rc not exists"]
abnormal = ["any", "check.single_delta.current_1 != ok", "check.single_delta.row_2 != ok", "check.single_delta.current_2 != ok"]
