# bitmaplib-copybitmap-zero.test.bas: with runtime error checking; the
# requester with its text is the tested behaviour, the case ends in it, and
# the check behind the command does not run; the original raises no error
# and runs on
fixed-orig = 78
runtime-errors = "on"

[asserts]
requester = "contains \"Illegal BitMap Size\""
"end.case" = "not exists"
"check.width_zero.after" = "== not-run"

[deviations."libs=cd"]
requester = "count == 0"
"end.case" = "exists"
"check.width_zero.after" = "== fail"
