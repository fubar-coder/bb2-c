# memacclib-peeks-negative-check.test.bas: with runtime error checking; the
# check behind the Peeks$ must not run.  The original has no error check and
# copies ~4 GB: the program does not come back (the hang check ends the
# session), the announcement is never answered
fixed-orig = 214
runtime-errors = "on"

[asserts]
"check.negative_length.after" = "== not-run"

[deviations."libs=cd"]
"check.negative_length.refused" = "== fail"
session = "== timeout"
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
