# expr-tsr-bitop.test.bas: an extension of the port (#1235, the
# operand-only type system); the original's values are the declared
# deviations of its cells
extension = 1235
exclude = ["compiler=port,libs=cd", "compiler=orig195,libs=clib"]

[matrix]
compiler = ["port", "orig195"]
libs = ["cd", "clib"]

[data]
"float.bas" = "basic-compile"
"float_dest.bas" = "basic-compile"

[asserts]
"data.float.bas" = "== \"error 4 Illegal Operator for Type\""
"data.float_dest.bas" = "== \"error 5 Illegal Operator for Type\""

[asserts."case=print_quick_operand"]
output = "== \"3\n\""

# the original's values (blitz2 1.95 with the CD's libraries), as measured:
[deviations."compiler=orig195"]
"check.not_of_a_quick.h_not" = "== fail"
"check.not_of_a_quick.h_not.actual" = "== $0000FFFF"
