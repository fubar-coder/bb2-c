# expr-tsr-conv-whole.test.bas: an extension of the port (#1235, the
# operand-only type system); the original's values are the declared
# deviations of its cells
extension = 1235
exclude = ["compiler=port,libs=cd", "compiler=orig195,libs=clib"]

[matrix]
compiler = ["port", "orig195"]
libs = ["cd", "clib"]

# the original's values (blitz2 1.95 with the CD's libraries), as measured:
[deviations."compiler=orig195"]
"check.negative_fractions.r_exact_constant" = "== fail"
"check.negative_fractions.r_exact_constant.actual" = "== -1"
"check.negative_fractions.r3_power" = "== fail"
"check.negative_fractions.r3_power.actual" = "== 15"
"check.a_quotient_at_the_top.r_long" = "== fail"
"check.a_quotient_at_the_top.r_long.actual" = "== -1"
"check.a_quotient_at_the_top.r2_long_by_quick" = "== fail"
"check.a_quotient_at_the_top.r2_long_by_quick.actual" = "== -10"
"check.beyond_the_range.r_float_wrap" = "== fail"
"check.beyond_the_range.r_float_wrap.actual" = "== 2147483647"
