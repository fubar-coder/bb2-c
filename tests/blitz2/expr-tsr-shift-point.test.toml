# expr-tsr-shift-point.test.bas: an extension of the port (#1235, the
# operand-only type system); the original refuses the constant with a point
# as the shifted operand, so nothing runs in its cells
extension = 1235
exclude = ["compiler=port,libs=cd", "compiler=orig195,libs=clib"]

[matrix]
compiler = ["port", "orig195"]
libs = ["cd", "clib"]

[asserts."case=print_a_constant_with_a_point_shifted"]
output = "== \".75\n4\n6\n\""

# the original's values (blitz2 1.95 with the CD's libraries), as measured:
[deviations."compiler=orig195"]
compile = "== \"error 13 Illegal Operator for Type\""
rc = "not exists"
"end.case" = "not exists"
"end.run" = "not exists"

[deviations."compiler=orig195,case=print_a_constant_with_a_point_shifted"]
output = "not exists"
