# expr-tsr-destination.test.bas: an extension of the port (#1235, the
# operand-only type system); the original's values are the declared
# deviations of its cells
extension = 1235
exclude = ["compiler=port,libs=cd", "compiler=orig195,libs=clib"]

[matrix]
compiler = ["port", "orig195"]
libs = ["cd", "clib"]

[asserts."case=print_same_quotient"]
output = "== \"6\n\""

[asserts."case=print_whole_quick"]
output = "== \"90000\n\""

# the original's values (blitz2 1.95 with the CD's libraries), as measured:

[deviations."compiler=orig195,case=print_whole_quick"]
output = "== \"24464.\n\""
