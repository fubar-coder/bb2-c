# expr-tsr-shift-top.test.bas: an extension of the port (#1235, the
# operand-only type system); the original's values are the declared
# deviations of its cells
extension = 1235
exclude = ["compiler=port,libs=cd", "compiler=orig195,libs=clib"]

[matrix]
compiler = ["port", "orig195"]
libs = ["cd", "clib"]

# the original's values (blitz2 1.95 with the CD's libraries), as measured:
[deviations."compiler=orig195"]
"check.below_another_operator.x_product" = "== fail"
"check.below_another_operator.x_product.actual" = "== $00007800"
"check.below_another_operator.y_unary_minus" = "== fail"
"check.below_another_operator.y_unary_minus.actual" = "== $FFFFFE00"
"check.a_quick_left_operand_and_a_sum.u_saturated" = "== fail"
"check.a_quick_left_operand_and_a_sum.u_saturated.actual" = "== 32768"
