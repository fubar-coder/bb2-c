# expr-tsr-fold.test.bas: an extension of the port (#1235, the
# operand-only type system); the original's values are the declared
# deviations of its cells
extension = 1235
exclude = ["compiler=port,libs=cd", "compiler=orig195,libs=clib"]

[matrix]
compiler = ["port", "orig195"]
libs = ["cd", "clib"]

[asserts."case=print_shifts_1233"]
output = "== \"-.5\n-.5\n\""

# the original's values (blitz2 1.95 with the CD's libraries), as measured:
[deviations."compiler=orig195"]
"check.division_1225.y_variable" = "== fail"
"check.division_1225.y_variable.actual" = "== 1"

[deviations."compiler=orig195,case=print_shifts_1233"]
output = "== \"-1\n-1\n\""
