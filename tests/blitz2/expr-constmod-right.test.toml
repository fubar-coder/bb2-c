# expr-constmod-right.test.bas: a bug of the original (blitz2 1.95): it computes
# such a constant expression (and its variable form) in the Mod's whole type,
# 0.5+6 Mod 4 is 2 under every destination; its values are the declared
# deviations of compiler=orig195
fixed-orig = 1227
exclude = ["compiler=orig195,libs=clib"]

[matrix]
compiler = ["port", "orig195"]
libs = ["cd", "clib"]

[deviations."compiler=orig195"]
"check.whole.l_sub_value" = "== fail"
"check.whole.l_sub_value.actual" = "== -2"
"check.whole.w_sub_value" = "== fail"
"check.whole.w_sub_value.actual" = "== -2"
"check.whole.b_sub_value" = "== fail"
"check.whole.b_sub_value.actual" = "== -2"
"check.whole.l_mul_value" = "== fail"
"check.whole.l_mul_value.actual" = "== 0"
"check.whole.w_mul_value" = "== fail"
"check.whole.w_mul_value.actual" = "== 0"
"check.whole.b_mul_value" = "== fail"
"check.whole.b_mul_value.actual" = "== 0"
"check.whole.l_addpoint_value" = "== fail"
"check.whole.l_addpoint_value.actual" = "== 1"
"check.whole.l_mulpoint_value" = "== fail"
"check.whole.l_mulpoint_value.actual" = "== -2"
"check.whole.w_mulpoint_value" = "== fail"
