# warn-datafrac-limit.test.bas: the warnings are the entries of
# compile.warnings (tedstub's WARNING lines of the job j000: the editor's
# requesters); "line N" of the editor is the line of this source (14 to 21),
# the first 8 places and one "- datafrac 2 more", nothing between them. The
# test of an extension of the port (the type warnings of the rework,
# #1235); the original gives no warning and reads the same values
extension = 1235
exclude = ["compiler=port,libs=cd", "compiler=orig195,libs=clib"]

[matrix]
compiler = ["port", "orig195"]
libs = ["cd", "clib"]

[asserts]
"compile.warnings" = "count == 9"

# the entries one per line, for the port; the original has none (below)
[asserts."compiler=port"]
"compile.warnings.1" = "== \"14 datafrac Fraction of a Data.b value discarded\""
"compile.warnings.2" = "== \"15 datafrac Fraction of a Data.b value discarded\""
"compile.warnings.3" = "== \"16 datafrac Fraction of a Data.b value discarded\""
"compile.warnings.4" = "== \"17 datafrac Fraction of a Data.b value discarded\""
"compile.warnings.5" = "== \"18 datafrac Fraction of a Data.b value discarded\""
"compile.warnings.6" = "== \"19 datafrac Fraction of a Data.b value discarded\""
"compile.warnings.7" = "== \"20 datafrac Fraction of a Data.b value discarded\""
"compile.warnings.8" = "== \"21 datafrac Fraction of a Data.b value discarded\""
"compile.warnings.9" = "== \"- datafrac 2 more\""

[deviations."compiler=orig195"]
"compile.warnings" = "count == 0"
