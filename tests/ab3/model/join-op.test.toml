# AmiBlitz3 refuses @@ after an operator (without OPTIMIZE 4 with this text)
# and makes no executable
# (docs/ab3/variant.md, row join_op)
[deviations."compiler=amiblitz3"]
variant = "join_op"
compile = "contains \"You need 'newsyntax' mode for that\""
"end.case" = "not exists"
"end.run" = "not exists"
rc = "not exists"
