# The run-output cases of AB3 mode as tests of the BASIC test model
# (change ab3-test-model; tests/ab3/CMakeLists.txt registers them as ab3_*):
# each case on blitz2-ab3 (side port) and on AmiBlitz3's CLI compiler (side
# oracle), compiled from the command line without -r; a test that needs -r
# sets runtime-errors = "off". A difference of AmiBlitz3 is a deviation of
# the cells of amiblitz3 with the row of docs/ab3/variant.md that records it.
#
# The time limits (task 3.4, measured 2026-11-27): fifteen AmiBlitz3
# sessions of a driver of 20 cases at the same time took 3.5 to 7.9 s each
# (the spike under heavier load: up to 14 s); blitz2-ab3's 1.0 to 1.5 s.
# timeout = 60 leaves room for a loaded host and is one of the time limits
# of the plain session key, so the cases of blitz2-ab3 may share bundles
# (design D14); the AmiBlitz3 session that hangs silently now and then
# (#976 kind) ends after it and runs again. hang-after is not set: the
# environment's run-hang-after counts from the first program run, so a
# silent compile is no hang, and a test that sets it is never bundled.
timeout = 60
runtime-errors = "on"

[matrix]
compiler = ["ab3", "amiblitz3"]
