# The Pages workflow for the Starlight site (site-starlight, task 8.3):
# the content of .github/workflows/pages.yml from the cut-over on (task 9.3,
# which copies this file there and removes it here). It assumes the layout
# after 9.3: Astro's publicDir is the default site/public/, so the API
# reference goes to site/public/api and is copied into site/dist/api.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'Doxyfile'
      - 'libs/include/**'
      - 'libs/deflibs/deflib.h'
      - 'libs/acidlibs/**'
      - 'libs/userlibs/rwe/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  api:
    # The API reference (Doxyfile) in Doxygen's official image, pinned by
    # tag; warnings fail the run. On the runner, not in a container job: the
    # image's entry point is doxygen itself.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Doxygen
        run: |
          mkdir -p site/public/api
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src \
            ghcr.io/doxygen/doxygen:Release_1_16_1 Doxyfile

      - name: Upload the API reference
        uses: actions/upload-artifact@v7
        with:
          name: api
          path: site/public/api
          if-no-files-found: error

  build:
    needs: api
    runs-on: ubuntu-latest
    # The pinned Node.js image of the local build and the site tests
    # (site/README.md); the tag pins Node.js.
    container: docker.io/library/node:26.13.1-bookworm-slim
    steps:
      - name: Install git
        # The image has no git. actions/checkout needs it for the history,
        # and the build reads the pages' dates from it (BB2_SITE_GITINFO).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the pages' dates need the full history

      - name: Trust the workspace
        # The container user differs from the owner of the checkout.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Put the API reference in place
        uses: actions/download-artifact@v8
        with:
          name: api
          path: site/public/api

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        # Astro's site and base are in site/astro.config.mjs; the package
        # script turns Astro's telemetry off. BB2_SITE_GITINFO=1: the pages'
        # last-modified dates from git as meta tags.
        working-directory: site
        env:
          BB2_SITE_GITINFO: '1'
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
